<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="fm23pv-version" content="74d062312a">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FM23 Positioning Viewer</title>
  <meta name="description" content="Posição aproximada dos 11 jogadores em 3 fases (defendendo, saindo com a bola, no ataque) a partir da formação, funções e instruções de equipe do FM23.">
  <style>
:root {
  --bg: #f3f4f1;
  --panel: #ffffff;
  --panel-2: #f7f8f6;
  --text: #1b221f;
  --muted: #5b6661;
  --border: #dadfd9;
  --accent: #1d7a4c;
  --accent-ink: #ffffff;
  --accent-soft: #e2f1e8;
  --danger: #b3261e;
  --warn: #8a5a00;
  --warn-bg: #fff4d6;
  --err-bg: #fde8e6;
  --pitch-a: #2e7a45;
  --pitch-b: #2a703f;
  --pitch-line: rgba(255, 255, 255, 0.82);
  --shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 2px 8px rgba(0, 0, 0, .05);
  --b-GK: #e7b416; --b-D: #2563eb; --b-DM: #0e7490; --b-M: #7c3aed; --b-AM: #ea580c; --b-ST: #dc2626;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101513; --panel: #181e1b; --panel-2: #1e2622; --text: #e5ebe7; --muted: #99a59f;
    --border: #2b3430; --accent: #3db57a; --accent-ink: #06210f; --accent-soft: #1b3326;
    --danger: #ff8a80; --warn: #ffd27a; --warn-bg: #3a2f12; --err-bg: #3d1d1a;
    --pitch-a: #22603a; --pitch-b: #1f5834; --pitch-line: rgba(255, 255, 255, 0.7);
    --shadow: 0 1px 2px rgba(0, 0, 0, .4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101513; --panel: #181e1b; --panel-2: #1e2622; --text: #e5ebe7; --muted: #99a59f;
  --border: #2b3430; --accent: #3db57a; --accent-ink: #06210f; --accent-soft: #1b3326;
  --danger: #ff8a80; --warn: #ffd27a; --warn-bg: #3a2f12; --err-bg: #3d1d1a;
  --pitch-a: #22603a; --pitch-b: #1f5834; --pitch-line: rgba(255, 255, 255, 0.7);
  --shadow: 0 1px 2px rgba(0, 0, 0, .4);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, select, input { font: inherit; color: inherit; }

.topbar {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--panel);
  position: sticky; top: 0; z-index: 5;
}
.brand h1 { font-size: 17px; margin: 0; letter-spacing: -0.01em; }
.brand p { margin: 0; color: var(--muted); font-size: 12.5px; }
.icon-btn {
  border: 1px solid var(--border); background: var(--panel-2); border-radius: 8px;
  width: 34px; height: 34px; cursor: pointer; flex: none;
}

.layout { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 16px; padding: 16px; align-items: start; }
.layout.collapsed { grid-template-columns: minmax(0, 1fr); }
.layout.collapsed .panel { display: none; }

.panel { display: flex; flex-direction: column; gap: 12px; position: sticky; top: 72px; max-height: calc(100vh - 88px); overflow: auto; padding-right: 2px; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 12px; box-shadow: var(--shadow); }
.card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; }
.row { display: flex; gap: 8px; }
.row select { flex: 1; min-width: 0; }
.hint { color: var(--muted); font-size: 12px; margin: 8px 0 0; }

select {
  background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
  padding: 6px 8px; min-height: 34px; max-width: 100%;
}
.btn {
  border: 1px solid var(--border); background: var(--panel-2); border-radius: 8px;
  padding: 6px 12px; min-height: 34px; cursor: pointer; white-space: nowrap;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.danger { color: var(--danger); }
.btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.btn-grid .btn { white-space: normal; font-size: 13px; }

.check { display: flex; gap: 8px; align-items: flex-start; margin: 6px 0; cursor: pointer; }
.check input { margin-top: 3px; }

/* editor de formação */
.slot-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-top: 10px; }
.slot {
  border: 1px dashed var(--border); border-radius: 6px; min-height: 34px; padding: 2px;
  font-size: 10.5px; line-height: 1.1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: transparent; color: var(--muted); cursor: pointer;
}
.slot.empty-cell { visibility: hidden; }
.slot.filled { border-style: solid; color: #fff; font-weight: 700; }
.slot.filled small { font-weight: 500; opacity: .85; font-size: 9.5px; }
.slot.selected { outline: 3px solid var(--text); outline-offset: 1px; }
.slot.target:not(.filled) { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.slot[data-band="GK"].filled { color: #1b1b1b; }

.validation:empty { display: none; }
.validation { margin-top: 8px; display: flex; flex-direction: column; gap: 4px; }
.validation .msg { font-size: 12px; padding: 6px 8px; border-radius: 6px; }
.validation .err { background: var(--err-bg); color: var(--danger); }
.validation .warn { background: var(--warn-bg); color: var(--warn); }
.validation .tip { background: var(--accent-soft); color: var(--text); }
.validation .tip .tip-tag { font-weight: 700; color: var(--accent); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
.validation .tip .link-btn { font-size: 12px; white-space: nowrap; }

/* lista de jogadores */
.player-list { display: flex; flex-direction: column; gap: 6px; }
.prow { display: grid; grid-template-columns: 22px 40px minmax(0, 1fr) 80px 38px 26px; gap: 5px; align-items: center; }
.prow .num {
  width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center;
  font-size: 11px; font-weight: 700; color: #fff;
}
.prow .num[data-band="GK"] { color: #1b1b1b; }
.prow .slotname { font-size: 12px; font-weight: 600; color: var(--muted); }
.pi-btn {
  border: 1px solid var(--border); background: var(--panel-2); border-radius: 7px; min-height: 30px;
  font-size: 11px; font-weight: 700; color: var(--muted); cursor: pointer; padding: 0 2px; white-space: nowrap;
}
.pi-btn.has { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.pi-btn.open { outline: 2px solid var(--accent); outline-offset: 1px; }
.pi-box { margin: 0 0 6px 27px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel-2); }
.pi-box .check { font-size: 12.5px; margin: 4px 0; }
.pi-box .check.disabled { color: var(--muted); opacity: .7; cursor: not-allowed; }
.pi-box .check.locked { opacity: 1; color: var(--text); }
.pi-box .check.locked small { color: var(--accent); font-weight: 600; }
.pi-box .pi-text { flex: 1; min-width: 0; }
.pi-box .check small { display: block; color: var(--muted); font-size: 11.5px; }
.pi-group { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 6px 0 2px; }
.pi-group:first-child { margin-top: 0; }
.guide-btn {
  border: 1px solid var(--border); background: var(--panel-2); border-radius: 50%; width: 24px; height: 24px; padding: 0;
  font: italic 700 12px/1 Georgia, "Times New Roman", serif; color: var(--muted); cursor: pointer;
}
.guide-btn:hover, .guide-btn:focus-visible { color: var(--accent); border-color: var(--accent); }
.link-btn {
  border: 0; background: none; padding: 0; color: var(--accent); font-weight: 600; cursor: pointer; text-align: left;
}
.link-btn:hover { text-decoration: underline; }
.info .link-btn { display: inline-block; margin-top: 4px; font-size: 12px; }

/* guia das funções */
dialog.guide {
  width: min(640px, calc(100vw - 32px)); max-height: min(86vh, 900px); padding: 0;
  border: 1px solid var(--border); border-radius: 14px; background: var(--panel); color: var(--text);
  box-shadow: 0 12px 40px rgba(0, 0, 0, .25);
}
dialog.guide[open] { display: flex; flex-direction: column; }
dialog.guide::backdrop { background: rgba(10, 14, 12, .45); }
.guide-head { display: flex; align-items: flex-start; gap: 10px; padding: 14px 16px 8px; }
.guide-title { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.guide-title h2 { margin: 0; font-size: 18px; letter-spacing: -0.01em; }
.guide-title select { max-width: 100%; font-size: 12.5px; padding: 4px 6px; border: 1px solid var(--border); border-radius: 7px; background: var(--panel-2); }
.guide-duties { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 10px; border-bottom: 1px solid var(--border); }
.chip {
  border: 1px solid var(--border); background: var(--panel-2); border-radius: 999px; padding: 3px 11px;
  font-size: 12.5px; cursor: pointer; min-height: 28px;
}
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.guide-body { overflow-y: auto; padding: 12px 16px 16px; }
.guide-summary { margin: 0 0 4px; font-size: 14.5px; }
.guide-note { margin: 0 0 8px; color: var(--muted); font-style: italic; }
.guide-sec { margin-top: 14px; }
.guide-sec h3 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 6px; }
.guide-sec ul { margin: 0; padding-left: 18px; }
.guide-sec li { margin: 3px 0; }
.guide-duty-list { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 10px; }
.guide-duty-list dt { font-weight: 600; color: var(--muted); }
.guide-duty-list dd { margin: 0; color: var(--muted); }
.guide-duty-list .on { color: var(--text); }
.attr-chips { display: flex; flex-wrap: wrap; gap: 5px; }
.attr { background: var(--accent-soft); color: var(--text); border-radius: 6px; padding: 2px 8px; font-size: 12.5px; }
button.attr { border: 0; font: inherit; font-size: 12.5px; cursor: pointer; }
.attr.has-desc { text-decoration: underline dotted; text-underline-offset: 3px; }
.attr.has-desc[aria-expanded="true"] { background: var(--accent); color: var(--accent-ink); text-decoration: none; }
.attr-desc { margin: 8px 0 0; padding: 8px 10px; border-left: 3px solid var(--accent); background: var(--panel-2); border-radius: 0 6px 6px 0; font-size: 13px; }
.guide-hint { margin: 8px 0 0; font-size: 12px; color: var(--muted); }
.guide-sub { margin: 10px 0 4px; font-weight: 600; font-size: 13px; }
.guide-details { margin-top: 8px; border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; background: var(--panel-2); }
.guide-details summary { cursor: pointer; font-weight: 600; font-size: 13px; color: var(--accent); }
.guide-details p { margin: 8px 0 0; font-size: 13px; }
.guide-details ul { margin: 0; padding-left: 18px; font-size: 13px; }
.guide-combos .link-btn { font-size: inherit; }
.guide-source { margin: 16px 0 0; font-size: 11.5px; color: var(--muted); border-top: 1px solid var(--border); padding-top: 8px; }
@media (max-width: 520px) {
  dialog.guide { width: calc(100vw - 32px); max-height: calc(100vh - 32px); }
  .guide-duty-list { grid-template-columns: minmax(0, 1fr); }
  .guide-duty-list dd { margin-bottom: 4px; }
}
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; }
.card-head h2 { margin: 0; }
.card-head .btn.small { margin-top: 0; }
.balance { margin: 0 0 8px; font-size: 12.5px; color: var(--muted); cursor: help; }
.suggest-box { border: 1px solid var(--accent); background: var(--accent-soft); border-radius: 10px; padding: 10px; margin-bottom: 10px; font-size: 12.5px; }
.sg-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 14px; }
.sg-close { width: 28px; height: 28px; }
.sg-ctx { display: block; font-size: 11.5px; color: var(--muted); font-weight: 400; }
.sg-parts { display: grid; gap: 2px; margin-bottom: 6px; }
.sg-part { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); }
.sg-part.up { color: var(--accent); font-weight: 600; }
.sg-part.down { color: var(--danger); }
.sg-val { font-variant-numeric: tabular-nums; white-space: nowrap; }
.sg-change { margin: 6px 0; }
.sg-change small { display: block; color: var(--muted); }
.sg-actions { align-items: center; margin-top: 6px; flex-wrap: wrap; }
.sg-actions .btn.small { margin-top: 0; }
.pi-box .check small.warn-note { color: var(--warn); }
.btn.small { min-height: 28px; padding: 3px 10px; font-size: 12px; margin-top: 6px; }
.prow select { font-size: 12.5px; padding: 4px 6px; min-height: 30px; width: 100%; }

.ti-form { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.ti-form label { display: grid; gap: 3px; font-size: 12.5px; color: var(--muted); }
.ti-form select { color: var(--text); }
.ti-form label.check { display: flex; color: var(--text); }

/* área principal */
.main { min-width: 0; }
.main-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.tabs { display: none; gap: 4px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 3px; }
.tab { border: 0; background: transparent; padding: 6px 10px; border-radius: 7px; cursor: pointer; font-size: 13px; }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }

.fields { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.fields .field-card.out-group { display: none; }
.groups { display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 3px; }
.groups .tab[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.ball-side { display: flex; align-items: center; gap: 2px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 3px; }
.ball-side-label { font-size: 11.5px; color: var(--muted); padding: 0 6px 0 4px; text-transform: uppercase; letter-spacing: .05em; }
.ball-side .tab[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.main-bar { flex-wrap: wrap; }
.field-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 10px; box-shadow: var(--shadow); min-width: 0; }
.field-card h3 { margin: 0 0 8px; font-size: 14px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.field-card h3 span { font-size: 11.5px; color: var(--muted); font-weight: 500; }
.info { min-height: 34px; margin: 8px 0 0; font-size: 12px; color: var(--muted); }
.info b { color: var(--text); }
.info .desc { display: block; margin-top: 4px; color: var(--text); opacity: .85; }

/* rolagem e zoom normais sobre o campo; só o modo editar regra trava o toque para arrastar jogadores */
svg.pitch { width: 100%; height: auto; display: block; border-radius: 8px; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
svg.pitch.editing { touch-action: none; }
.pitch .stripe-a { fill: var(--pitch-a); }
.pitch .stripe-b { fill: var(--pitch-b); }
.pitch .ln { fill: none; stroke: var(--pitch-line); stroke-width: .32; }
.pitch .third { stroke: rgba(255, 255, 255, .22); stroke-width: .25; stroke-dasharray: 1 1; }
.pitch .spot { fill: var(--pitch-line); }
.pitch .ball { fill: #fff; stroke: #111; stroke-width: .25; }
.pitch .ghost { fill: none; stroke: rgba(255, 255, 255, .7); stroke-width: .25; stroke-dasharray: .7 .5; }
.pitch .arrow { stroke: rgba(255, 255, 255, .75); stroke-width: .3; fill: none; }
.pitch .arrowhead { fill: rgba(255, 255, 255, .85); }
.pitch g.pl { transition: transform .45s ease; cursor: default; }
.pitch.anim g.pl { transition: transform 1.1s cubic-bezier(.45, 0, .2, 1); }
.pitch.editing g.pl { cursor: grab; }
.pitch g.pl.dragging { transition: none; cursor: grabbing; }
.pitch g.pl.dragging .pc { stroke: #ffeb3b; stroke-width: .5; }
.pitch .pc { stroke: #fff; stroke-width: .32; }
.pitch .ab { fill: #fff; font-weight: 800; text-anchor: middle; dominant-baseline: central; letter-spacing: -.03em; pointer-events: none; }
.pitch .pl[data-band="GK"] .ab { fill: #1b1b1b; }
.pitch .nb { fill: #0f1512; stroke: #fff; stroke-width: .18; }
.pitch .no { fill: #fff; font-size: 1.25px; font-weight: 700; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.pitch .zone { fill-opacity: .16; stroke-opacity: .7; stroke-width: .3; stroke-dasharray: .8 .6; pointer-events: none; }
.pitch g.op { transition: transform .45s ease; }
.pitch.anim g.op { transition: transform 1.1s cubic-bezier(.45, 0, .2, 1); }
.pitch .oc { fill: #f3f4f6; stroke: #111827; stroke-width: .3; }
.pitch .oab { fill: #111827; font-weight: 800; text-anchor: middle; dominant-baseline: central; letter-spacing: -.03em; pointer-events: none; }
.opp-line { margin: -4px 0 8px; font-size: 12px; color: var(--muted); }
.shape-line { margin: -4px 0 6px; font-size: 12px; color: var(--text); font-variant-numeric: tabular-nums; }
.scores { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 0 0 8px; }
.score { cursor: help; }
.score-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 11.5px; color: var(--muted); }
.score-head b { color: var(--text); font-variant-numeric: tabular-nums; }
.score-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin-top: 2px; }
.score-bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.opp-form.off { opacity: .55; }
.opp-roles { margin-top: 4px; }
.opp-roles summary { cursor: pointer; font-size: 13px; color: var(--text); padding: 4px 0; }
.opp-roles .player-list { margin: 6px 0; }
.prow .num.opp-num { background: #f3f4f6; border: 1px solid #111827; border-radius: 4px; width: 18px; height: 18px; }
.pitch .shape-line-us { fill: none; stroke: rgba(255, 255, 255, .55); stroke-width: .35; stroke-linejoin: round; }
.pitch .shape-line-opp { fill: none; stroke: rgba(17, 24, 39, .45); stroke-width: .3; stroke-dasharray: 1 .6; stroke-linejoin: round; }
.pitch .shape-line-us.stagger { stroke-dasharray: .25 .9; stroke-linecap: round; stroke-width: .45; }
.pitch .shape-line-opp.stagger { stroke-dasharray: .25 .9; stroke-linecap: round; }
.pitch .pi-dot { fill: #fff; stroke: #0f1512; stroke-width: .2; }
.pitch .pl.hl .pc { stroke: #ffeb3b; stroke-width: .55; }

.anim-view { max-width: 560px; margin: 0 auto; }
.anim-head { display: flex; justify-content: center; margin-bottom: 10px; }
.anim-steps { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.anim-steps span { padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border); font-size: 12.5px; color: var(--muted); background: var(--panel); }
.anim-steps span.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }

.legend { color: var(--muted); font-size: 12px; margin: 12px 2px 0; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }

.toast {
  position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(20px);
  background: var(--text); color: var(--bg); padding: 9px 14px; border-radius: 10px; font-size: 13px;
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: calc(100vw - 32px); z-index: 20;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.fatal { max-width: 640px; margin: 40px auto; padding: 16px; background: var(--err-bg); color: var(--danger); border-radius: 12px; }
.fatal code { background: rgba(0,0,0,.06); padding: 1px 5px; border-radius: 4px; }

/* Abaixo de 1280px os 3 campos lado a lado ficam pequenos demais: vira abas. */
@media (max-width: 1279px) {
  .tabs { display: flex; overflow-x: auto; max-width: 100%; scrollbar-width: none; }
  .tabs .tab { white-space: nowrap; }
  .groups { display: none; }
  .fields .field-card.out-group.active { display: block; }
  .fields { grid-template-columns: minmax(0, 1fr); max-width: 560px; }
  .fields .field-card:not(.active) { display: none; }
  .layout.collapsed .fields { margin: 0 auto; }
}
@media (max-width: 860px) {
  .layout { grid-template-columns: minmax(0, 1fr); padding: 12px 16px; }
  .panel { position: static; max-height: none; overflow: visible; order: 2; }
  .main { order: 1; }
  .fields { max-width: none; }
  .brand p { display: none; }
}
@media (max-width: 400px) {
  .prow { grid-template-columns: 22px 34px minmax(0, 1fr) 70px 34px 24px; gap: 4px; }
  .tab { padding: 6px 7px; font-size: 12px; }
  .main-bar .btn { padding: 6px 9px; }
}

/* movimentos possíveis */
.row-label { display: grid; gap: 3px; font-size: 12.5px; color: var(--muted); margin: 6px 0; }
.row-label select { color: var(--text); }
.pitch .mv { fill: none; stroke-width: .42; stroke-linecap: round; opacity: .92; pointer-events: stroke; transition: opacity .15s; }
.pitch .mv.f1 { stroke-width: .32; stroke-dasharray: .9 .6; opacity: .8; display: none; }
.pitch.mv-all .mv.f1 { display: inline; }
.pitch.mv-none .mv { display: none; }
.pitch .mv.sel, .pitch.mv-none .mv.sel { display: inline; opacity: 1; }
.pitch.mv-focus .mv:not(.sel) { opacity: .12; }
.info .mv-info { display: block; margin-top: 4px; color: var(--text); }
.info .mv-item { display: block; padding-left: 2px; }
.info .mv-item.main { font-weight: 600; }
.info .mv-item.note { font-weight: 400; color: var(--muted); }
.info .mv-item i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; border: 1px solid rgba(0, 0, 0, .35); }
.legend .mv-key i { border-radius: 2px; border: 1px solid rgba(0, 0, 0, .35); }
</style>
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="togglePanel" aria-label="Mostrar/ocultar painel" title="Mostrar/ocultar painel">☰</button>
    <div class="brand">
      <h1>FM23 Positioning Viewer</h1>
      <p>Modelo heurístico por regras — representa o comportamento típico de cada função, não o motor do jogo.</p>
    </div>
  </header>

  <div class="layout" id="layout">
    <aside class="panel" id="panel">
      <section class="card">
        <h2>Formação</h2>
        <div class="row">
          <select id="preset" aria-label="Formação pré-definida"></select>
          <button id="applyPreset" class="btn primary">Aplicar</button>
        </div>
        <div id="slotGrid" class="slot-grid" aria-label="Editor de formação"></div>
        <p class="hint">Clique num jogador e depois num slot vazio para movê-lo.</p>
        <div id="validation" class="validation" aria-live="polite"></div>
      </section>

      <section class="card">
        <div class="card-head">
          <h2>Funções e tarefas</h2>
          <button class="btn small" id="suggestBtn" title="Procura trocas de função e tarefa que melhoram o equilíbrio da tática">✨ Sugerir funções</button>
        </div>
        <p class="balance" id="balanceLine"></p>
        <div id="suggestBox" class="suggest-box" hidden></div>
        <div id="playerList" class="player-list"></div>
      </section>

      <section class="card">
        <h2>Instruções de equipe</h2>
        <div id="tiForm" class="ti-form"></div>
      </section>

      <section class="card">
        <h2>Adversário</h2>
        <label class="check"><input type="checkbox" id="oppEnabled"> Mostrar o time adversário nas 3 fases</label>
        <div id="oppForm" class="ti-form opp-form"></div>
      </section>

      <section class="card">
        <h2>Visualização</h2>
        <label class="check"><input type="checkbox" id="optShape"> Mostrar linhas de estrutura e medidas</label>
        <label class="row-label">Movimentos possíveis
          <select id="optMoves" aria-label="Movimentos possíveis">
            <option value="main">Só os principais</option>
            <option value="all">Todos (principais e ocasionais)</option>
            <option value="none">Só do jogador tocado</option>
          </select>
        </label>
        <label class="check"><input type="checkbox" id="optGhost"> Mostrar posição base (fantasma) e seta</label>
        <label class="check"><input type="checkbox" id="optEdit"> Modo editar regra (arrastar jogador grava override)</label>
      </section>

      <section class="card">
        <h2>Arquivos</h2>
        <div class="btn-grid">
          <button class="btn" id="exportTactic">Exportar tática</button>
          <button class="btn" id="importTactic">Importar tática</button>
          <button class="btn" id="exportRoles">Exportar roles.json</button>
          <button class="btn" id="importRoles">Importar roles.json</button>
          <button class="btn danger" id="resetTactic">Resetar tática</button>
          <button class="btn danger" id="resetRoles">Resetar regras</button>
        </div>
        <p class="hint" id="rolesStatus"></p>
        <input type="file" id="fileTactic" accept="application/json,.json" hidden>
        <input type="file" id="fileRoles" accept="application/json,.json" hidden>
      </section>
    </aside>

    <main class="main">
      <div class="main-bar">
        <div class="groups" role="group" aria-label="Fases exibidas" id="groups">
          <button class="tab" data-group="sem">Sem a bola</button>
          <button class="tab" data-group="com">Com a bola</button>
          <button class="tab" data-group="todas">Todas</button>
        </div>
        <div class="tabs" role="tablist" id="tabs"></div>
        <div class="ball-side" role="group" aria-label="Lado da bola" id="ballSide" title="Lado do campo onde está a bola: o time desliza para ela (mais sem a bola)">
          <span class="ball-side-label">Bola</span>
          <button class="tab" type="button" data-side="L">Esq</button>
          <button class="tab" type="button" data-side="C">Centro</button>
          <button class="tab" type="button" data-side="R">Dir</button>
        </div>
        <button class="btn primary" id="animate">▶ Animar</button>
      </div>
      <div class="fields" id="fields"></div>
      <div class="anim-view" id="animView" hidden>
        <div class="anim-head">
          <div class="anim-steps" id="animSteps"></div>
        </div>
        <div class="field-card"><svg class="pitch anim" id="animSvg" role="img" aria-label="Animação entre as fases"></svg></div>
      </div>
      <p class="legend" id="legend"></p>
    </main>
  </div>

  <dialog class="guide" id="guide" aria-labelledby="guideTitle">
    <div class="guide-head">
      <div class="guide-title">
        <h2 id="guideTitle"></h2>
        <select id="guideRole" aria-label="Ver outra função"></select>
      </div>
      <button class="icon-btn" id="guideClose" type="button" aria-label="Fechar">✕</button>
    </div>
    <div class="guide-duties" id="guideDuties" role="group" aria-label="Tarefa"></div>
    <div class="guide-body" id="guideBody"></div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="application/json" id="data-role-guide">{"source":{"title":"The Book of Roles","author":"Daljit Singh","year":2023,"game":"FM23","note":"Resumo próprio do livro (não é o texto original). Os atributos estão em português com o nome em inglês na dica; a tradução é do site e pode não bater exatamente com a do jogo."},"attributesNote":"Os atributos são relativos à divisão: 15 de Primeiro toque é excelente numa liga de ponta e sobre-humano numa divisão baixa. A régua do autor: 9 é a média da divisão mais baixa, e some 2 a cada acesso. Compare o elenco com a liga a cada temporada (Book of Roles, p. 3).","forwardTypes":{"page":121,"intro":"O livro divide os atacantes em três tipos. Mais do que o rótulo, olhe o que a função faz com e sem a bola.","questions":["Quer que ele corra pelos canais, o espaço entre zagueiro e lateral?","Quer que ele segure a posição, como uma referência fixa?","Quer que ele corte para dentro para usar o outro pé num lance específico?","Precisa de uma movimentação bem específica, como fechar e deambular para o espaço?"],"note":"Não é preciso usar funções simples em divisões baixas: os atributos são relativos à liga.","types":[{"key":"creative","label":"Criativo","desc":"Recua e procura o passe em profundidade. Serve a sistemas com muitas tarefas de Apoio.","roles":[{"role":"false_nine","note":"O mais criativo: recua, põe os colegas no jogo e tem técnica para isso."},{"role":"deep_lying_forward","duty":"S","note":"Recua, liga o jogo e dá o passe em profundidade."},{"role":"complete_forward","note":"Faz de tudo; espere o inesperado."}]},{"key":"support","label":"De apoio","desc":"Recua ou segura a bola para pôr os outros no jogo. Qualquer atacante que recua ou arrisca passes pode cumprir esse papel.","roles":[{"role":"pressing_forward","duty":"S","note":"Às vezes recua, mas fica central; bom em sistemas de um atacante para os outros aproveitarem o movimento, e também faz muitos gols. Subestimado no FM23."},{"role":"pressing_forward","duty":"A","note":"Abre pelos canais: no 3-5-2 recebe aberto e solta para o ala cruzar livre."},{"role":"target_forward","note":"Recua muito para segurar a bola e pôr os outros no jogo."},{"role":"deep_lying_forward","note":"Segura a bola e põe os outros no jogo nas duas tarefas; também conta como criativo."},{"role":"complete_forward","duty":"S","note":"Recua, segura a bola e abre pelos canais; um pouco mais criativo, mas menos que o Falso 9."}]},{"key":"pure","label":"Puro","desc":"Não se afasta muito da área.","roles":[{"role":"pressing_forward","duty":"S","note":"Não abre pelos canais nem se afasta da última linha; o autor chegou a 100 gols de um atacante nessa função."},{"role":"advanced_forward","note":"Ótimo para bloco médio ou baixo que lança nas costas. Sozinho, é o foco do ataque; em dupla, um dos dois às vezes recua na progressão."},{"role":"poacher","note":"Fica na área, não abre e nunca tenta o passe em profundidade, então devolve a bola e põe os outros no jogo. Pivô + Matador continua muito bom no FM23."}]}]},"attributes":{"acceleration":{"label":"Aceleração","en":"Acceleration","desc":"Quanto tempo o jogador leva para chegar à velocidade máxima: é o que vence o marcador na arrancada. Contra marcação apertada em sistemas fluidos, junte Sem bola, Primeiro toque, Equilíbrio e Drible."},"aerial_ability":{"label":"Alcance aéreo","en":"Aerial Ability","desc":"Até onde o goleiro alcança com as mãos ao saltar. Nos jogadores de linha, o equivalente é a Impulsão."},"aggression":{"label":"Agressividade","en":"Aggression","desc":"Mal compreendido: é bom para defensores desde que venha com bom Desarme, Antecipação, Concentração e Decisões. A chance de uma entrada violenta depende de atributos ocultos (jogo sujo e espírito esportivo), não deste."},"agility":{"label":"Agilidade","en":"Agility"},"anticipation":{"label":"Antecipação","en":"Anticipation","desc":"Defensivo e ofensivo. Com Aceleração e Sem bola, faz bons jogadores para atacar os canais; ajuda o zagueiro lento com bom Posicionamento a chegar antes na cobertura."},"balance":{"label":"Equilíbrio","en":"Balance","desc":"Manter-se em pé sob pressão, com e sem a bola. Com velocidade de drible, faz o jogador girar sobre o marcador (Maradona, Gascoigne); fica mais perigoso com bom Primeiro toque."},"bravery":{"label":"Bravura","en":"Bravery","desc":"Disposição para ações que podem machucar. Com bravura baixa, o jogador evita ajudar quando há risco de se lesionar. Bravura e Condição física natural baixas juntas são uma combinação a evitar na contratação."},"command_of_area":{"label":"Domínio da área","en":"Command of Area","desc":"O quanto o goleiro manda na área. Sair bem nas bolas altas também depende de Alcance aéreo, Segurar a bola, Antecipação, Decisões e Posicionamento."},"communication":{"label":"Comunicação","en":"Communication"},"composure":{"label":"Compostura","en":"Composure","desc":"Como o jogador lida com a pressão. Com Primeiro toque, domina rápido e segura a bola sob pressão para distribuir; importante para construtores e para quem liga o jogo nas transições."},"concentration":{"label":"Concentração","en":"Concentration","desc":"Foco lance a lance ao longo do jogo. Essencial para volantes e defensores, que sem ele só veem o perigo tarde demais. Desde o FM19 vale para todos os jogadores de linha e pesa quando as transições falham."},"crossing":{"label":"Cruzamento","en":"Crossing"},"decisions":{"label":"Decisões","en":"Decisions","desc":"Como o jogador avalia as opções; a Visão determina quantas ele enxerga. Passe, Visão e Decisões formam o trio do construtor."},"determination":{"label":"Determinação","en":"Determination","desc":"Vontade de se esforçar mesmo perdendo: time com pouca determinação em posições-chave desaba depois de sofrer gols. Para o autor é o atributo mais importante, porque afeta a personalidade, o desenvolvimento e o rendimento."},"dribbling":{"label":"Drible","en":"Dribbling"},"eccentricity":{"label":"Excentricidade","en":"Eccentricity","desc":"Tendência do goleiro a fazer coisas inesperadas e arriscadas. É um atributo negativo."},"finishing":{"label":"Finalização","en":"Finishing"},"first_touch":{"label":"Primeiro toque","en":"First Touch","desc":"Essencial para manter a bola e distribuir sob pressão, e bom também para atacantes. É quase obrigatório para criadores e um dos atributos que mais pesam em táticas de posse. Para defensores de apoio é secundário: lá, Concentração pesa mais."},"flair":{"label":"Talento","en":"Flair","desc":"O extraordinário: dribles e fintas inesperados que pegam o adversário desprevenido. Bom para funções criativas, como o Trequartista."},"handling":{"label":"Segurar a bola","en":"Handling","desc":"Se o goleiro segura a bola depois de defender, em vez de soltá-la."},"heading":{"label":"Cabeceio","en":"Heading"},"jumping_reach":{"label":"Impulsão","en":"Jumping Reach"},"kicking":{"label":"Chute (goleiro)","en":"Kicking","desc":"Até onde o goleiro chuta. A precisão depende de Decisões, Técnica, Trabalho em equipe e Visão."},"long_shots":{"label":"Chute de longe","en":"Long Shots"},"marking":{"label":"Marcação","en":"Marking"},"natural_fitness":{"label":"Condição física natural","en":"Natural Fitness","desc":"Como o jogador mantém a forma lesionado ou sem treinar, e por quanto tempo conserva os atributos físicos depois do auge. Importante para veteranos."},"off_the_ball":{"label":"Sem bola","en":"Off the Ball","desc":"Movimentação sem a bola para dar opção de passe ou abrir espaço. Talvez o atributo mais importante para sistemas fluidos, em que os jogadores entram e saem de triângulos de passe."},"one_on_one":{"label":"Um contra um","en":"One on Ones"},"pace":{"label":"Velocidade","en":"Pace","desc":"Velocidade máxima, depois de atingida. Para contra-atacar de trás, junte Velocidade, Aceleração, Primeiro toque, Equilíbrio e Drible."},"passing":{"label":"Passe","en":"Passing"},"positioning":{"label":"Posicionamento","en":"Positioning","desc":"O equivalente defensivo do Sem bola: ler o lance e se colocar no lugar certo quando o time não tem a bola. Toda tarefa de Defender pede bom posicionamento; sem ele, o jogador precisa de Aceleração e Concentração para voltar a tempo."},"reflexes":{"label":"Reflexos","en":"Reflexes"},"rushing_out":{"label":"Saídas do gol","en":"Rushing Out","desc":"Com Velocidade e Aceleração, define o quanto o goleiro sai da área para fechar ou jogar de líbero. Com boa Antecipação, Primeiro toque, Compostura e Decisões, pode ser um bom Goleiro Líbero."},"stamina":{"label":"Resistência","en":"Stamina"},"strength":{"label":"Força","en":"Strength"},"tackling":{"label":"Desarme","en":"Tackling"},"teamwork":{"label":"Trabalho em equipe","en":"Teamwork","desc":"Chave para o time jogar como unidade: o jogador abre mão da glória pessoal. Desde o FM19 também mede o quanto ele segue as instruções táticas. Se um lado fica exposto, olhe Índice de trabalho, Trabalho em equipe e Bravura de quem devia cobrir."},"technique":{"label":"Técnica","en":"Technique","desc":"Execução de ações difíceis: voleios, dominar bolas difíceis, desarmes complicados, dribles e lançamentos longos em diagonal."},"throwing":{"label":"Reposição com as mãos","en":"Throwing"},"vision":{"label":"Visão","en":"Vision","desc":"Quantas opções o jogador enxerga. As Decisões dizem como ele as processa."},"work_rate":{"label":"Índice de trabalho","en":"Work Rate"}},"roles":{"goalkeeper":{"page":9,"summary":"Joga simples: procura um colega livre e, se não houver, chuta longo. A estratégia muda a reposição: cautelosa, ele afasta; agressiva, sai jogando com os zagueiros.","duties":{"D":"Fica na área e raramente sai dela."},"attributes":["aerial_ability","command_of_area","communication","first_touch","handling","kicking","reflexes","one_on_one","throwing","anticipation","decisions","positioning"],"tips":["Não precisa de bom primeiro toque; com a instrução de equipe \"sair jogando\" ainda passa curto.","Instruções de reposição mudam o estilo: \"para o pivô\" se o chute for bom, \"rolar para os zagueiros\" em táticas de posse.","Para jogo direto, a característica de lançar com as mãos para contra-atacar funciona bem com boas decisões e visão."]},"sweeper_keeper":{"page":9,"summary":"Goleiro e líbero ao mesmo tempo: varre bolas perto da área e começa contra-ataques com passes diretos. É a peça de times de posse com linha alta, como último defensor que joga com os pés.","duties":{"D":"Mais cauteloso; só faz o passe de contra-ataque se ele estiver claro.","S":"Sai da área e arrisca mais nos passes de contra-ataque.","A":"Vai bem longe da área e conduz com a bola; é a versão mais arriscada."},"attributes":{"D":["aerial_ability","command_of_area","communication","first_touch","handling","kicking","reflexes","one_on_one","throwing","anticipation","decisions","positioning","composure","concentration","agility"],"S":["aerial_ability","command_of_area","first_touch","kicking","reflexes","one_on_one","anticipation","decisions","positioning","composure","concentration","agility","rushing_out","acceleration","eccentricity"],"A":["aerial_ability","command_of_area","first_touch","kicking","reflexes","one_on_one","anticipation","decisions","positioning","composure","concentration","agility","rushing_out","acceleration","eccentricity"]},"combos":[{"role":"ball_playing_defender","why":"Juntos atraem a pressão alta e a furam, ou impedem que o adversário marque a reposição curta."},{"role":"deep_lying_playmaker","why":"Uma opção de passe perto dele é o que faz a função render."}],"risks":["Na experiência do autor, rende menos do que a SI pretendia; o melhor dele aparece com linha alta, saindo para cortar a bola em profundidade e passar para o lado."]},"central_defender":{"page":12,"summary":"Impede o passe do adversário e afasta o perigo. Em táticas mais agressivas também precisa de técnica e compostura para manter a posse com passes simples.","duties":{"D":"Fica em linha com o parceiro, marca o atacante e evita que a bola chegue à área.","St":"Sobe à frente da linha para fechar o adversário antes da área.","Co":"Recua um pouco para varrer as bolas nas costas da defesa."},"attributes":{"D":["heading","marking","tackling","anticipation","bravery","concentration","decisions","determination","positioning","jumping_reach","strength","aggression"],"St":["heading","marking","tackling","anticipation","bravery","concentration","decisions","determination","positioning","jumping_reach","strength","aggression"],"Co":["heading","marking","tackling","anticipation","bravery","concentration","decisions","determination","positioning","jumping_reach","strength","aggression","acceleration"]},"tips":["Para táticas de posse: características \"não tenta passes em profundidade\" e \"raramente conduz\".","\"Fica sempre atrás\" garante que ele não saia da linha."],"risks":["Sem opção de passe, tende a lançar longo; a mentalidade e as instruções de equipe pesam."]},"ball_playing_defender":{"page":12,"summary":"Zagueiro que constrói: desde o FM20 sai conduzindo por padrão e tenta passes que quebram linhas. Leva a bola até um construtor e reavalia; em algumas transições aparece até no terço final.","duties":{"D":"Em linha com o parceiro; com a bola, conduz e procura o passe em profundidade.","St":"Sobe à frente da linha para fechar antes da área.","Co":"Recua para varrer as bolas nas costas da defesa."},"attributes":{"D":["heading","marking","tackling","anticipation","bravery","concentration","decisions","determination","positioning","jumping_reach","strength","aggression","first_touch","technique","vision","passing","composure"],"St":["heading","marking","tackling","anticipation","bravery","concentration","decisions","determination","positioning","jumping_reach","strength","aggression","first_touch","technique","vision","passing","composure"],"Co":["heading","marking","tackling","anticipation","bravery","concentration","decisions","positioning","jumping_reach","strength","first_touch","technique","vision","passing","composure","acceleration"]},"combos":[{"role":"sweeper_keeper","why":"Contra a pressão alta, os dois atraem o adversário e soltam a bola para um construtor ou numa diagonal longa."},{"role":"inside_forward","why":"Um Atacante Interior (A) com espaço é o alvo da diagonal longa que ele lança de trás."}],"tips":["Funciona bem tanto em linha de 4 quanto de 5.","\"Fica sempre atrás\" impede que ele saia da linha; \"tenta passes decisivos\" reforça o lançamento."],"risks":["Arriscado com jogador de primeiro toque, compostura e drible fracos.","Com \"driblar mais\", pode passar direto pelo construtor e seguir conduzindo.","Com \"sair jogando\" e mentalidade positiva, às vezes desce pelo corredor até o terço final."]},"no_nonsense_cb":{"page":15,"summary":"A prioridade é afastar a bola, sem arriscar e sem fazer falta. Joga direto, para o espaço ou para um colega.","duties":{"D":"Fica em linha com o parceiro e afasta o perigo.","St":"Sobe à frente da linha para fechar antes da área.","Co":"Recua para varrer as bolas nas costas da defesa."},"attributes":["heading","marking","tackling","determination","positioning","jumping_reach","strength"],"tips":["Boa função para quem é fraco de passe, primeiro toque ou drible.","Também serve a times ofensivos como lançamento direto, quando há tarefas de ataque na frente."]},"wide_centre_back":{"notCovered":true},"libero":{"page":16,"summary":"Recua atrás da linha para varrer, cobrir erros e recuperar bolas soltas; com a posse, sobe para o meio-campo. No FM23 joga numa linha de 3, em Apoio ou Ataque.","duties":{"S":"Com a posse garantida, entra no meio-campo e tenta passes para os atacantes.","A":"Vai bem mais à frente: ameaça de longe e põe os colegas na cara do gol."},"attributes":{"S":["heading","marking","passing","tackling","anticipation","composure","concentration","decisions","positioning","teamwork","acceleration","balance","jumping_reach"],"A":["heading","marking","passing","tackling","anticipation","composure","concentration","decisions","positioning","teamwork","acceleration","balance","jumping_reach","pace","stamina"]},"tips":["Rende mais sem construtores à frente dele: na maior parte do tempo forma a linha de 3, mas com \"sair jogando\" e ninguém criando à frente chega ao terço adversário.","Boa função para um construtor mais velho reconvertido, desde que os zagueiros ao lado sejam rápidos."]},"full_back":{"page":19,"summary":"A função mais versátil do jogo. Defende primeiro e apoia com corridas por fora; é a mais defensiva entre laterais e alas, mas sobe quando o time precisa de largura, mesmo em Defender.","duties":{"D":"Fica atrás, faz passes simples pelo lado ou para o meio e cruza de trás.","S":"Dá largura ao meio-campo e escolhe entre cruzar e enfiar a bola.","A":"Faz o overlap e cruza de primeira na área.","Au":"Segue a mentalidade do time e libera instruções que outras tarefas não têm; o autor evita."},"attributes":{"D":["marking","tackling","positioning","teamwork"],"S":["marking","tackling","anticipation","concentration","positioning","teamwork","work_rate","stamina"],"A":["crossing","tackling","anticipation","positioning","teamwork","work_rate","acceleration","stamina"],"Au":["marking","tackling","anticipation","concentration","positioning","teamwork","work_rate","stamina"]},"combos":[{"role":"wide_midfielder","why":"No 4-4-2, os dois trabalham em dupla pelo lado."}],"tips":["Em Apoio e Defender só se compromete com o ataque quando o time controla o terço adversário.","\"Menos passes arriscados\" e \"passes curtos\" ajudam a manter a posse.","Com a característica de trocar de flanco, vira um pivô que começa as viradas no próprio campo.","\"Fechar mais\" faz ele passar por dentro na saída, útil para quem perde a bola construindo de trás.","Cruzamento cedo em diagonal para um atacante rápido (o Leicester de 2016) exige ocupar o lateral adversário com um médio ala ou extremo em Ataque."],"risks":["Overlap/underlap aproximam o lateral (S) do meio-campo; arriscado se o time não circula bem a bola."]},"inverted_full_back":{"notCovered":true},"wing_back":{"page":23,"summary":"Lateral com mais ênfase no ataque e uma das posições mais exigentes. Rende mais em sistemas sem outra fonte de largura, como o losango e o 5-3-2. No FM23 não tem mais \"driblar mais\" embutido.","duties":{"D":"Ajuda a manter a posse e a passar pelo meio, mas prioriza voltar; cruza de trás e fica acima de um Lateral (S).","S":"Conduz e sobe para apoiar o ataque.","A":"Conduz por fora, cruza mais e da linha de fundo.","Au":"Segue a mentalidade do time."},"attributes":["acceleration","pace","stamina","crossing","decisions","teamwork","work_rate","off_the_ball"],"combos":[{"role":"inverted_winger","why":"Juntos criam sobrecarga pelo lado."},{"role":"inside_forward","why":"Com \"trocar de flanco\", vira o jogo para o Atacante Interior (A) ou o outro ala atacando do lado oposto."}],"risks":["Preso em postura defensiva, custa a ser liberado; \"cruzar de trás\" ou \"cruzamentos cedo\" resolvem.","Em Ataque, sem outra largura, muitos cruzamentos são bloqueados (sai mais escanteio que cruzamento); considere Apoio."]},"complete_wing_back":{"page":25,"summary":"Adora atacar e quer decidir no terço adversário. Tem \"deambular\" embutido: começa aberto e pode cortar para dentro ou ir à linha.","duties":{"S":"Equilibra o instinto ofensivo com alguma responsabilidade defensiva.","A":"Mais aventureiro, joga quase sempre no campo adversário."},"attributes":["crossing","dribbling","first_touch","passing","tackling","decisions","off_the_ball","positioning","teamwork","work_rate","acceleration","pace","stamina"],"risks":["Em Ataque é pego fora de posição na transição defensiva; sem ninguém cobrindo, leva cartões tentando parar o adversário.","Por deambular, precisa de boas decisões para escolher entre abrir e fechar."]},"inverted_wing_back":{"page":26,"summary":"Defende como lateral, mas com a bola fecha para o meio e sobe para a faixa de volante, congestionando o centro em vez de dar largura. É uma mistura de volante e lateral.","duties":{"D":"Segura a posição; com overlap pode descer pelo lado quando o time controla o terço adversário.","S":"Pode atacar a área por dentro, às vezes mais à frente que um Médio Centro (S).","A":"Como o Apoio, com mais liberdade para subir.","Au":"Segue a mentalidade do time."},"attributes":["marking","passing","tackling","anticipation","decisions","determination","positioning","work_rate","acceleration","stamina"],"combos":[{"role":"winger","why":"Com extremos à frente, os dois IWB ficam um pouco à frente do volante; com overlap sobem por fora."}],"tips":["No FM23 joga como Ala quando há dois volantes, quando o único volante não é o central (o IWB do lado dele) ou quando não há extremo ou médio ala à frente. O site modela essas três condições."],"risks":["As conduções deixam o lado exposto à bola diagonal.","Com linha alta, escolher o jogador errado é catastrófico: precisa de técnica, aceleração, resistência e índice de trabalho."]},"no_nonsense_fb":{"page":22,"summary":"Foca na defesa e raramente avança; joga direto, sem arriscar.","duties":{"D":"Fica atrás e afasta o perigo."},"attributes":["marking","tackling","strength"],"tips":["Boa função para quem é fraco de passe, primeiro toque ou drible, em times que priorizam afastar a bola."]},"defensive_midfielder":{"page":31,"summary":"Protege a linha defensiva fechando quem chega e segura a bola enquanto o time se reorganiza. Um pouco mais criativo que o Âncora: tenta passes mais longos e arriscados.","duties":{"D":"Fica entre a defesa e o meio e recicla a posse de trás.","S":"Sobe para a linha do meio e apoia o ataque."},"attributes":["tackling","positioning","teamwork","work_rate","concentration","stamina"],"tips":["Sem instruções travadas, é boa opção para um jogador criativo que você não quer prender num estilo."],"risks":["Pode sair para pressionar mais longe que o Âncora; se outros também pressionam no meio, ele entra junto e deixa a defesa exposta.","Precisa de posicionamento, concentração e decisões, porque às vezes toma decisões ruins."]},"deep_lying_playmaker":{"page":49,"summary":"Começa as jogadas de trás, entre a defesa e o meio, com passes precisos; também defende. Desde o FM19 segura a posição em todas as tarefas. Para um construtor que sobe, use o Regista.","duties":{"D":"Fica à frente da defesa e quase não apoia o ataque.","S":"Sai com a bola da defesa e tenta passes em profundidade."},"attributes":["first_touch","passing","technique","composure","decisions","vision","balance"],"combos":[{"role":"sweeper_keeper","why":"Opção de passe perto do goleiro para sair jogando."}],"risks":["Precisa de colegas que lhe deem tempo e espaço.","Se houver funções criativas por perto (por exemplo, um IWB conduzindo), o time pode ignorá-lo.","Contra defesas baixas e congestionadas rende menos jogando de trás.","Em times mais fracos, contra pressão alta, precisa também de compostura, equilíbrio e primeiro toque."]},"anchor":{"page":33,"summary":"O \"carregador de piano\": fica no buraco entre a defesa e o meio, intercepta, desarma e entrega passes simples aos criativos. Não sai para pressionar alto nem para apoiar o ataque. É o volante mais disciplinado.","duties":{"D":"Fica à frente dos zagueiros, sem se afastar deles; com a bola no campo adversário, acompanha o time."},"attributes":["tackling","anticipation","composure","concentration","decisions","positioning"],"tips":["Protege o centro contra chutes de fora.","Isola o centroavante solitário como opção de passe.","Ótimo para levar a bola com segurança aos construtores do meio."],"risks":["Não fecha os lados: a dupla com os zagueiros é central."]},"half_back":{"page":38,"summary":"Entre um líbero agressivo e um volante: recua entre os zagueiros, que abrem e sobem, e oferece uma saída para reciclar a posse quando o ataque trava.","duties":{"D":"Fica perto dos zagueiros em quase todas as fases; no ataque sobe um pouco, e com Alas em Apoio/Ataque chega ao terço adversário."},"attributes":["first_touch","passing","technique","anticipation","composure","decisions","positioning","teamwork"],"combos":[{"role":"sweeper_keeper","why":"Na construção, a posição dele vira saída de passe para o goleiro."},{"role":"wing_back","why":"Ao abrir os zagueiros, ele empurra os alas para cima; com eles em Apoio/Ataque, sobe junto."}],"risks":["Pode deixar os zagueiros desprotegidos para fechar ameaças perto dos lados.","Comparado a Volante, Âncora e Recuperador, fica mais vezes alto demais na transição defensiva."]},"ball_winning_midfielder":{"page":35,"summary":"O desarmador: fecha o adversário, rouba a bola e a entrega aos criativos. Desde o FM19 é mais disciplinado, limitado pela forma defensiva; o que o separa do Âncora é desarmar mais forte.","duties":{"D":"Recupera a bola no centro e entrega rápido.","S":"Tenta recuperar mais alto e apoiar o contra-ataque que nasce dali."},"attributes":["tackling","aggression","bravery","determination","teamwork","work_rate","concentration","stamina","positioning","strength"],"tips":["Um bom lugar para ele é o meio-campo em Apoio, atrapalhando a transição do adversário pelo meio."],"risks":["Na faixa de volante pode sair para fechar os lados e deixar os zagueiros sozinhos.","Precisa de colegas com bom posicionamento e concentração em volta."]},"regista":{"page":44,"summary":"Versão mais agressiva do Construtor Recuado, para times de posse que pressionam alto. Tem liberdade total para ditar o jogo de trás e aparece bem alto quando o time ataca (Pirlo).","duties":{"S":"Recua para receber do goleiro e, no ataque, sobe quase até a entrada da área."},"attributes":["first_touch","passing","technique","composure","decisions","off_the_ball","vision"],"combos":[{"role":"segundo_volante","why":"Boa dupla de volantes: o Regista cria, o Segundo Volante conduz e chega na área."}],"tips":["Muito útil no 4-1-3-2: sobe junto com o meio e mantém o adversário pressionado.","Rende melhor com tempo mais baixo e com o time instalado no campo adversário."],"risks":["Com tempo alto, zagueiro simples chutando para frente e alas conduzindo rápido, pode virar espectador; \"jogar pelo meio\" ajuda, mas não resolve tudo."]},"roaming_playmaker":{"page":47,"summary":"O coração do time: pega a bola atrás e a leva adiante com urgência, volta para cobrir e acampa na entrada da área procurando o chute ou o passe decisivo.","duties":{"S":"Circula por todo o meio-campo, para o lado onde o time precisa dele."},"attributes":["dribbling","first_touch","passing","technique","anticipation","composure","decisions","determination","off_the_ball","vision","work_rate","acceleration","stamina","natural_fitness"],"tips":["Avalie pelo percentual de passes certos e pelos passes que geram assistências, não pelas assistências dele.","Funciona com qualquer tempo."],"risks":["Deambula muito: pense em quem cobre o espaço que ele deixa à frente da defesa.","Quando o ataque é cortado, costuma estar mal posicionado."]},"segundo_volante":{"page":40,"summary":"Mistura de Construtor Recuado, Recuperador e Box-to-Box: começa recuado, conduz agressivamente pelo seu lado e chega atrasado na área. Só existe na faixa de volante, em dupla ou fora do centro.","duties":{"S":"Escolhe quando subir; também pode atuar no meio-espaço e atrair marcadores.","A":"Sobe já na progressão, quase na linha do extremo, e chega atrasado na área."},"attributes":["stamina","work_rate","determination","bravery","anticipation","positioning","vision","decisions","off_the_ball","tackling","first_touch","passing","composure"],"combos":[{"role":"anchor","why":"Dupla segura, mas pouco criativa."},{"role":"defensive_midfielder","why":"Um pouco melhor que com o Âncora, porque o volante não fica colado na defesa."},{"role":"regista","why":"Outra boa dupla de volantes."},{"role":"winger","why":"Com um Extremo (S) do mesmo lado, forma uma dupla de lado muito forte."},{"role":"false_nine","why":"O Falso 9 recua e abre o espaço que o SV (A) ataca."}],"tips":["Boa opção para times de posse com forma defensiva, como o 4-2-2-2 com volantes."]},"central_midfielder":{"page":62,"summary":"Ligação versátil entre defesa e ataque, e uma das funções mais personalizáveis. A posição não é travada como a da Mezzala ou do Carrilero.","duties":{"D":"Fica mais recuado, corta contra-ataques e controla o ritmo pelo meio.","S":"Equilibra defesa e ataque: sobe quando precisa e enfia passes para o terço final.","A":"Avança para o terço final.","Au":"Segue a mentalidade do time."},"attributes":{"D":["passing","tackling","concentration","teamwork","positioning","aggression"],"S":["first_touch","passing","decisions","teamwork"],"A":["first_touch","passing","decisions","off_the_ball"],"Au":["first_touch","passing","decisions","teamwork"]},"combos":[{"role":"carrilero","why":"CM (S) + Carrilero, com alas em Defender, montam um 4-2-3-1 de posse."}],"tips":["Dá para montar um Recuperador sem \"desarmar mais forte\" (e sem o risco de expulsão) usando \"pressionar muito mais\"."]},"box_to_box":{"page":73,"summary":"Dinamismo nos dois sentidos: chega atrasado para cruzamentos e chutes de fora e volta para proteger a linha. Por estar em Apoio, na prática não é o mais rápido de área a área.","duties":{"S":"Aparece à frente da defesa para ajudar e chega à área com o time instalado no campo adversário."},"attributes":["passing","tackling","decisions","determination","off_the_ball","positioning","work_rate","acceleration","natural_fitness","stamina"],"tips":["Não recua para ajudar o goleiro a sair jogando.","Demora a acompanhar quando um ala conduz; aparece de verdade com o time instalado no campo adversário, e nunca é o primeiro a chegar na área."]},"advanced_playmaker":{"page":76,"summary":"Busca o espaço entre o meio e a defesa adversária para receber e virar defesa em ataque num instante. Joga no meio, na meia ou aberto (aberto, fecha para o meio por conta própria).","duties":{"S":"Fica no bolsão e distribui para os colegas que apoiam e para os atacantes.","A":"Conduz, parte para cima e ataca a área."},"attributes":{"S":["first_touch","passing","technique","composure","decisions","vision"],"A":["dribbling","first_touch","balance","passing","technique","composure","decisions","off_the_ball","vision"]},"combos":[{"role":"mezzala","why":"Aberto, com uma Mezzala (A) ao lado, os dois atraem vários marcadores e liberam espaço."},{"role":"wing_back","why":"Atrai marcadores e solta a bola para o Ala (D) cruzar de trás para um pivô."}],"risks":["Num meio de 2 precisa ser excepcional (índice de trabalho, posicionamento, bravura, concentração, desarme).","Overlap do mesmo lado atrapalha as corridas dele; num meio de 3, tire o overlap desse lado.","Se perder a bola alto, segurando-a contra vários marcadores, o time fica exposto à bola nas costas."]},"mezzala":{"page":68,"summary":"\"Meio-ponta\": trabalha os meio-espaços do terço final, segura a bola e cria sobrecarga. Abre mais na consolidação do meio; defender não é a prioridade.","duties":{"S":"Equilibra ataque e defesa.","A":"Deixa a marcação para os colegas e procura fazer algo com a bola."},"attributes":{"S":["off_the_ball","decisions","flair","dribbling","passing","vision","teamwork","anticipation","composure","work_rate","determination","bravery","positioning"],"A":["off_the_ball","decisions","flair","dribbling","passing","vision","teamwork","anticipation","composure","balance","first_touch"]},"combos":[{"role":"wide_playmaker","why":"Dupla que segura a bola e libera um lateral de ataque atrás deles."},{"role":"advanced_playmaker","why":"Aberto e com a Mezzala (A), atraem marcadores e liberam espaço."}],"tips":["Rende mais num meio de 3, em losango ou em linha.","Com pressão agressiva e linha de pressão alta, a Mezzala (A) também defende lá na frente."],"risks":["Ao subir, abre o meio; com time fraco em sem bola, compostura e passe, evite \"trabalhar a bola até a área\".","Precisa de bons ladrões de bola em volta."]},"carrilero":{"page":63,"summary":"\"Carregador\": cobre o corredor entre o centro e o lado, liga defesa e meio, mantém a bola rodando e protege os lados. Não entra em nenhuma das duas áreas; no ataque fica na entrada da área.","duties":{"S":"Fecha o portador no lado, segura a posição quando há gente suficiente atrás da bola e não sai sem necessidade."},"attributes":["tackling","positioning","decisions","marking","acceleration","strength","bravery","determination"],"combos":[{"role":"inside_forward","why":"No 4-2-3-1, cobre o meio-espaço enquanto o Atacante Interior ataca."},{"role":"central_midfielder","why":"Com um CM (S), forma um meio de 2 de posse (exige planejamento de funções)."}],"tips":["Ideal em losango, mas funciona em qualquer formação.","Não exige jogador de alta habilidade.","Características como \"entra na área adversária\" mudam bastante o papel."],"risks":["Ao subir, abre o meio (mesmo risco da Mezzala)."]},"wide_midfielder":{"page":53,"summary":"Ataca e defende pelo lado com trabalho em vez de velocidade ou drible. Muito personalizável e, para o autor, uma das funções mais subestimadas: fica no meio-espaço na saída e no ataque.","duties":{"D":"Fica atrás e cruza de trás; com linha de pressão padrão, só fecha o portador perto do próprio campo.","S":"Fica mais recuado e tenta passes angulados para a área ou cruza quando precisa.","A":"Faz cruzamentos rápidos do terço final.","Au":"Totalmente personalizável."},"attributes":{"D":["passing","tackling","positioning","teamwork","work_rate"],"S":["passing","teamwork","work_rate","concentration"],"A":["crossing","passing","first_touch","teamwork","work_rate"],"Au":["passing","teamwork","work_rate"]},"combos":[{"role":"wing_back","why":"Em Apoio põe o ala no jogo, e o ala quase sempre tem tempo para cruzar livre."},{"role":"full_back","why":"No 4-4-2, os dois trabalham em dupla pelo lado."}],"tips":["Um dos melhores papéis para um 4-4-2 de baixo risco.","Com \"fechar mais\" e \"cortar para dentro\", ataca por dentro (estilo Mahrez).","Em Ataque dá para imitar o Beckham de 1999: fecha e cruza de trás."]},"winger":{"page":81,"summary":"Tenta vencer o marcador por fora: cola na linha quando o time ataca e procura a linha de fundo. Precisa de técnica e velocidade.","duties":{"S":"Tenta passar rápido pelo marcador e cruzar cedo para os atacantes.","A":"Parte para cima da defesa no terço final antes de chutar, cruzar ou passar."},"attributes":{"S":["crossing","passing","technique","acceleration","pace","teamwork","work_rate"],"A":["crossing","passing","first_touch","technique","acceleration","pace","teamwork","work_rate"]},"combos":[{"role":"segundo_volante","why":"Extremo (S) e Segundo Volante do mesmo lado formam uma dupla forte."}],"tips":["Para colar sempre na linha, ensine a característica; com \"cortar para dentro\" ele alterna entre abrir e entrar, o que é difícil de marcar."],"risks":["Sozinho em Ataque, os cruzamentos tendem a ser bloqueados; em Apoio, com alguém perto, cria cruzamentos melhores."]},"wide_playmaker":{"page":79,"summary":"A principal fonte de criatividade vindo do lado: fecha para dentro, onde escapa da pressão do meio e pode ficar sem marcação. Sem a bola, fica no lado e cobre o lateral.","duties":{"S":"Com a bola, senta no meio-campo e cria de lá.","A":"Ocupa o espaço entre a defesa e o meio adversários; pode ficar alto demais para voltar."},"attributes":{"S":["first_touch","passing","technique","composure","decisions","positioning","vision"],"A":["first_touch","passing","technique","composure","decisions","off_the_ball","positioning","teamwork"]},"combos":[{"role":"mezzala","why":"Dupla que segura a bola e dá várias opções a um lateral de ataque atrás deles."}],"tips":["Ótimo para viradas diagonais.","Funciona bem no 4-4-1-1 e no 4-4-2."],"risks":["Funções erradas em volta o isolam: se o outro lado concentra o jogo (por exemplo, BBM, Mezzala (A), Extremo Invertido (A) e IWB), ele é esquecido."]},"defensive_winger":{"page":59,"summary":"Pressiona o lateral adversário para recuperar alto e, quando o time controla o meio, segura a bola ou vai à linha de fundo. Nada de firulas: passe simples ou se livra da bola.","duties":{"D":"Muito disciplinado: segura a posição com a bola, fecha linha de passe e só pressiona no próprio campo.","S":"Pressiona, tenta passar pelo marcador e cruzar cedo; pode fechar para dentro como um meia agressivo."},"attributes":{"D":["aggression","anticipation","concentration","determination","positioning","teamwork","work_rate","passing","marking","tackling","stamina"],"S":["crossing","dribbling","aggression","anticipation","concentration","determination","positioning","teamwork","work_rate","passing","marking","tackling","stamina"]},"combos":[{"role":"wing_back","why":"Protege o lado de um Ala (A): segura a posição quando o ala conduz por dentro ou passa por fora."}],"risks":["Em Apoio, a pressão pode tirá-lo de posição, principalmente com instruções de pressão mais intensa."]},"inverted_winger":{"page":84,"summary":"Parte aberto, com o pé trocado, e corta para dentro para abrir o corredor ao lateral. Desde o FM20 é mais criativo que o Atacante Interior (Sané contra Salah): sobrecarrega um lado para abrir o outro.","duties":{"S":"Faz diagonais e procura passes em profundidade pelo meio ou viradas para o outro lado.","A":"Parte para cima da defesa, passa ou finaliza; no 4-1-4-1 vira um segundo atacante chegando atrasado."},"attributes":{"S":["acceleration","dribbling","crossing","first_touch","composure","decisions","passing","vision","technique","agility","off_the_ball"],"A":["acceleration","dribbling","crossing","first_touch","composure","decisions","passing","vision","technique","agility","finishing","off_the_ball"]},"combos":[{"role":"roaming_playmaker","why":"O autor usa Extremo Invertido (A) com Construtor Móvel (S) e uma Mezzala no outro lado, num 4-1-2-3, para sobrecarregar os dois lados."},{"role":"shadow_striker","why":"No 4-2-3-1, com um Segundo Atacante ou Construtor Avançado (A) no meio, ele tem alvos no terço final."},{"role":"full_back","why":"Joga bem com lateral que faz overlap."}],"tips":["Mesmo em Ataque, às vezes se posiciona para cortar linhas de passe.","Como pode driblar, passar, chutar ou cruzar, ajuda ser bom com os dois pés."],"risks":["Precisa de espaço: evite outras tarefas de ataque perto dele.","Com uma Mezzala do mesmo lado, os dois ocupam a mesma zona; a sobrecarga só funciona se ambos cruzarem bem na diagonal.","Com um Box-to-Box ao lado pode ficar isolado, porque o BBM não abre.","Em Apoio não fica no ombro do último defensor; contra defesa baixa isso pesa."]},"attacking_midfielder":{"page":88,"summary":"Joga atrás dos atacantes e cria ou finaliza no terço final antes de a defesa fechar o espaço. A posição central permite virar o jogo.","duties":{"S":"Ajuda a defesa e fica no bolsão em vez de entrar na área; pode aparecer no próprio campo para apoiar.","A":"Cria para os atacantes e chega na área como mais uma ameaça."},"attributes":{"S":["first_touch","passing","technique","anticipation","decisions"],"A":["first_touch","passing","technique","anticipation","decisions","off_the_ball"]},"tips":["Função genérica, personalizável para correr entre lateral e zagueiro.","Pode chegar atrasado na área como alvo do cruzamento."],"risks":["Para render, exige boas funções e tarefas em volta no terço final."]},"enganche":{"page":93,"summary":"O \"gancho\": ponto fixo entre o meio e o ataque, em volta do qual o time se movimenta (Riquelme). Um construtor parado, só em Apoio.","duties":{"S":"Fica no meio para fazer o jogo circular; não pressiona no terço final."},"attributes":["first_touch","passing","technique","composure","decisions","off_the_ball","vision"],"tips":["Use formações que esticam a defesa e funções em volta que façam o movimento por ele."],"risks":["Sem as funções certas em volta, é ignorado e tira notas baixas.","Função de nicho, menos comum no futebol atual; teve seus dias de glória no FM17."]},"trequartista":{"page":97,"summary":"Criativo que circula muito: recua até o meio-campo para receber (mais que o Enganche), cai pelos lados e chega atrasado na área. Quase não defende; o time o carrega sem a bola. Joga no meio, nos lados ou no ataque.","duties":{"A":"Pode agir como Atacante Interior, Extremo, construtor ou atacante; às vezes fica no ombro do último defensor."},"attributes":["first_touch","passing","technique","anticipation","composure","decisions","off_the_ball","vision","work_rate","stamina"],"combos":[{"role":"poacher","why":"Dupla de ataque para contra-ataque direto."},{"role":"advanced_forward","why":"Contrapeso criativo a um atacante mais simples no 4-4-2 ou 4-4-1-1."}],"risks":["Não serve para uma pressão em que toda a frente pressiona: na meia, ele pode não pressionar.","Para cobrir terreno e ainda ser ameaça, precisa de índice de trabalho e resistência altos."]},"shadow_striker":{"page":103,"summary":"Finalizador vindo de trás: participa da construção, recua um pouco para ajudar a passar pelo meio e chega atrasado na área. Também pressiona os defensores.","duties":{"A":"No próprio campo, ajuda a recuperar conforme a linha de pressão; com a bola bem atrás, para de marcar e espera o contra-ataque."},"attributes":["finishing","anticipation","composure","decisions","determination","off_the_ball","work_rate","stamina","passing"],"combos":[{"role":"target_forward","why":"O pivô escora de cabeça para ele atacar o espaço."},{"role":"deep_lying_forward","why":"O Atacante Recuado recua e tenta lançá-lo."},{"role":"complete_forward","why":"Funciona se o Completo tiver cara de pivô e souber recuar e passar."}],"tips":["Bom no 4-4-1-1, 4-3-1-2 e 4-2-3-1; também em sistemas sem centroavante."],"risks":["Sofre contra times com dois volantes, porque falta espaço.","Se perder a bola na construção, o time fica mal posicionado para o contra-ataque."]},"inside_forward":{"page":112,"summary":"Corta de fora para dentro e parte para cima da defesa; rende mais com o pé trocado. O movimento abre espaço para o lateral e atrai mais de um marcador.","duties":{"S":"Corta para dentro e tenta pôr os colegas na cara do gol, ou chuta de longe.","A":"Ataca a defesa no ombro do último defensor; finaliza, passa ou cruza."},"attributes":{"S":["dribbling","passing","technique","decisions","off_the_ball","acceleration","balance","agility"],"A":["dribbling","composure","finishing","passing","balance","agility","technique","decisions","off_the_ball","acceleration"]},"combos":[{"role":"ball_playing_defender","why":"É o alvo da diagonal longa do Zagueiro com Bola."},{"role":"carrilero","why":"No 4-2-3-1, o Carrilero cobre o meio-espaço que ele deixa."}],"risks":["A corrida pode ser inútil sem um plano: use-o para atacar espaço (A) ou para controlar a posse num lado (S).","Em Ataque precisa de espaço para atacar a área: crie sobrecarga ou atraia o adversário."]},"raumdeuter":{"page":108,"summary":"\"Intérprete do espaço\" (Müller): procura bolsões e espera o momento de romper a linha. Pode passar períodos parado e não defende.","duties":{"A":"Abre ou fecha procurando espaço, ora fundo, ora alto; é o primeiro a atacar o espaço quando o time recupera."},"attributes":["anticipation","composure","decisions","concentration","determination","off_the_ball","work_rate","balance","stamina","acceleration"],"combos":[{"role":"inside_forward","why":"Atacante Interior (S) + Mezzala do outro lado sobrecarregam aquele lado e abrem espaço para ele."},{"role":"mezzala","why":"Ajuda a sobrecarregar o lado oposto."}],"tips":["Crie espaço para ele: concentre o jogo no lado oposto, com sobrecarga, um ala de ataque e alguém que vire o jogo.","Linha de pressão que atraia o adversário abre espaço atrás da defesa."],"risks":["Só é útil com quem faça o passe decisivo para ele.","Exige cobertura atrás, porque não defende."]},"wide_target_forward":{"page":106,"summary":"Referência pelo lado para bolas longas e chutões, de preferência contra um lateral menor e mais fraco: segura a bola e recicla para os colegas.","duties":{"S":"Ganha no físico do lateral e escora para quem chega.","A":"Vira o foco do ataque: recebe aberto e põe os outros no jogo."},"attributes":["strength","off_the_ball","passing","balance","first_touch","work_rate","teamwork","anticipation","vision"],"combos":[{"role":"wing_back","why":"Escora para o ala cruzar de trás."},{"role":"mezzala","why":"Funções que atacam o espaço que ele cria: Mezzala (A), lateral de overlap, Box-to-Box, Segundo Atacante."},{"role":"box_to_box","why":"Chega para aproveitar as escoras."},{"role":"shadow_striker","why":"Ataca o espaço que ele abre."}],"tips":["Ótimo para sobrecarga num lado no 4-2-3-1.","Com \"cortar para dentro\", fecha e incomoda ainda mais.","Laterais e extremos podem mirar os cruzamentos nele."]},"advanced_forward":{"page":142,"summary":"Lidera a linha e é o foco do ataque: o atacante mais avançado e o mais agressivo do jogo, sempre no ombro do último defensor.","duties":{"A":"Ataca a profundidade e persegue bolas mal passadas e chutões para ganhar a posse."},"attributes":["finishing","anticipation","composure","acceleration","off_the_ball"],"combos":[{"role":"inverted_wing_back","why":"Em sistemas diretos e profundos, IWB, Ala Completo, Zagueiro com Bola e Goleiro Líbero soltam bolas de trás para ele."},{"role":"ball_playing_defender","why":"Lança de trás para ele."},{"role":"sweeper_keeper","why":"Mais uma fonte de bola longa."}],"tips":["Rende melhor contra sistemas que deixam espaço nas costas."],"risks":["Sofre contra defesas baixas: baixe a linha de pressão para criar espaço (aí precisa de aceleração e controle de bola).","É o que mais cai em impedimento.","Sozinho pode sair em carreira solo; precisa de apoio, normalmente um extremo em Ataque."]},"complete_forward":{"page":146,"summary":"Técnica do Atacante Recuado, gol do Matador e força do Pivô: cria, finaliza e circula muito, deambulando como um Falso 9 e caindo pelos lados.","duties":{"S":"Recua, parte para cima, chuta de longe, cai pelos lados e enfia bolas na defesa.","A":"Como o Apoio, mais vezes na área."},"attributes":{"S":["d   <script type="application/json" id="data-alerts">{"note":"Alertas de combinação tirados dos riscos do Book of Roles (Daljit Singh, FM23). A detecção de cada regra está em tacticalAlerts (src/engine/engine.js); aqui ficam o texto, a página do livro e a função ligada ao guia. {slots} vira a lista de slots envolvidos. Cada alerta tira pontos do critério 'Combinações sem risco conhecido' do índice de equilíbrio.","balanceWeight":10,"penaltyPerAlert":0.35,"rules":{"ap_overlap":{"role":"advanced_playmaker","page":77,"text":"{slots}: o overlap do mesmo lado atrapalha as corridas do Construtor Avançado. Tire o overlap desse lado ou troque a função."},"mez_iw_same_side":{"role":"mezzala","page":119,"text":"{slots}: Mezzala e Extremo Invertido do mesmo lado ocupam o mesmo meio-espaço. A sobrecarga só rende se os dois cruzarem bem na diagonal."},"iw_bbm_same_side":{"role":"inverted_winger","page":119,"text":"{slots}: com o Box-to-Box do mesmo lado, o Extremo Invertido pode ficar isolado, porque o BBM não abre. Um lateral fazendo overlap ajuda."},"wp_isolated":{"role":"wide_playmaker","page":79,"text":"{slots}: o jogo tende a se concentrar no outro lado (funções dinâmicas lá), e o Construtor Aberto pode ser esquecido."},"enganche_no_movers":{"role":"enganche","page":93,"text":"{slots}: o Enganche é um ponto fixo e precisa de gente se movimentando em volta (tarefas de Ataque, quem deambula ou abre pelos canais). Com menos de dois assim, tende a ser ignorado."},"af_lone":{"role":"advanced_forward","page":143,"text":"{slots}: Avançado sozinho sem nenhum jogador aberto em Ataque tende a sair em carreira solo. O livro sugere um extremo em Ataque como apoio."},"regista_bypassed":{"role":"regista","page":46,"text":"{slots}: com Zagueiro Simples lançando direto e mentalidade alta, o Regista pode virar espectador. \"Jogar pelo meio\" ajuda, mas não resolve tudo."},"roamer_unscreened":{"role":"roaming_playmaker","page":48,"text":"{slots}: função que deambula na faixa de volante sem ninguém que segure a posição na frente da defesa. Pense em quem protege esse espaço quando ele sai."},"mezzala_no_cover":{"role":"mezzala","page":69,"text":"{slots}: a Mezzala (A) deixa a marcação com os colegas e precisa de um ladrão de bola ou de um meio-campista que segure a posição por perto."},"treq_press":{"role":"trequartista","page":98,"text":"{slots}: com linha de pressão alta, o Trequartista na meia não acompanha a pressão do resto da frente."},"wb_attack_no_width":{"role":"wing_back","page":25,"text":"{slots}: ala em Ataque como única largura daquele lado tende a ter os cruzamentos bloqueados (sai mais escanteio que cruzamento). Considere Apoio."},"cwb_attack_no_support":{"role":"complete_wing_back","page":26,"text":"{slots}: Ala Completo em Ataque sem ninguém em Apoio ou Defender do mesmo lado para ajudá-lo. O livro avisa que ele fica longe na transição defensiva e leva cartões tentando parar o adversário."},"ss_vs_two_dm":{"role":"shadow_striker","page":104,"text":"{slots}: o adversário joga com dois volantes, e o Segundo Atacante sofre com a falta de espaço."},"raumdeuter_no_overload":{"role":"raumdeuter","page":109,"text":"{slots}: o Raumdeuter precisa de sobrecarga no lado oposto para ter espaço, e lá há menos de dois jogadores em Ataque."}}}</script>
