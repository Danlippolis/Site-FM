<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="fm23pv-version" content="0c17f1068f">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FM23 Positioning Viewer</title>
  <meta name="description" content="Posição aproximada dos 11 jogadores em 3 fases (defendendo, saindo com a bola, no ataque) a partir da formação, funções e instruções de equipe do FM23.">
  <style>
:root {
  --bg: #f3f4f1;
  --panel: #ffffff;
  --panel-2: #f7f8f6;
  --text: #1b221f;
  --muted: #5b6661;
  --border: #dadfd9;
  --accent: #1d7a4c;
  --accent-ink: #ffffff;
  --accent-soft: #e2f1e8;
  --danger: #b3261e;
  --warn: #8a5a00;
  --warn-bg: #fff4d6;
  --err-bg: #fde8e6;
  --pitch-a: #2e7a45;
  --pitch-b: #2a703f;
  --pitch-line: rgba(255, 255, 255, 0.82);
  --shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 2px 8px rgba(0, 0, 0, .05);
  --b-GK: #e7b416; --b-D: #2563eb; --b-DM: #0e7490; --b-M: #7c3aed; --b-AM: #ea580c; --b-ST: #dc2626;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101513; --panel: #181e1b; --panel-2: #1e2622; --text: #e5ebe7; --muted: #99a59f;
    --border: #2b3430; --accent: #3db57a; --accent-ink: #06210f; --accent-soft: #1b3326;
    --danger: #ff8a80; --warn: #ffd27a; --warn-bg: #3a2f12; --err-bg: #3d1d1a;
    --pitch-a: #22603a; --pitch-b: #1f5834; --pitch-line: rgba(255, 255, 255, 0.7);
    --shadow: 0 1px 2px rgba(0, 0, 0, .4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101513; --panel: #181e1b; --panel-2: #1e2622; --text: #e5ebe7; --muted: #99a59f;
  --border: #2b3430; --accent: #3db57a; --accent-ink: #06210f; --accent-soft: #1b3326;
  --danger: #ff8a80; --warn: #ffd27a; --warn-bg: #3a2f12; --err-bg: #3d1d1a;
  --pitch-a: #22603a; --pitch-b: #1f5834; --pitch-line: rgba(255, 255, 255, 0.7);
  --shadow: 0 1px 2px rgba(0, 0, 0, .4);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, select, input { font: inherit; color: inherit; }

.topbar {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--panel);
  position: sticky; top: 0; z-index: 5;
}
.brand h1 { font-size: 17px; margin: 0; letter-spacing: -0.01em; }
.brand p { margin: 0; color: var(--muted); font-size: 12.5px; }
.icon-btn {
  border: 1px solid var(--border); background: var(--panel-2); border-radius: 8px;
  width: 34px; height: 34px; cursor: pointer; flex: none;
}

.layout { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 16px; padding: 16px; align-items: start; }
.layout.collapsed { grid-template-columns: minmax(0, 1fr); }
.layout.collapsed .panel { display: none; }

.panel { display: flex; flex-direction: column; gap: 12px; position: sticky; top: 72px; max-height: calc(100vh - 88px); overflow: auto; padding-right: 2px; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 12px; box-shadow: var(--shadow); }
.card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; }
.row { display: flex; gap: 8px; }
.row select { flex: 1; min-width: 0; }
.hint { color: var(--muted); font-size: 12px; margin: 8px 0 0; }

select {
  background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
  padding: 6px 8px; min-height: 34px; max-width: 100%;
}
.btn {
  border: 1px solid var(--border); background: var(--panel-2); border-radius: 8px;
  padding: 6px 12px; min-height: 34px; cursor: pointer; white-space: nowrap;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.danger { color: var(--danger); }
.btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.btn-grid .btn { white-space: normal; font-size: 13px; }

.check { display: flex; gap: 8px; align-items: flex-start; margin: 6px 0; cursor: pointer; }
.check input { margin-top: 3px; }

/* editor de formação */
.slot-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-top: 10px; }
.slot {
  border: 1px dashed var(--border); border-radius: 6px; min-height: 34px; padding: 2px;
  font-size: 10.5px; line-height: 1.1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: transparent; color: var(--muted); cursor: pointer;
}
.slot.empty-cell { visibility: hidden; }
.slot.filled { border-style: solid; color: #fff; font-weight: 700; }
.slot.filled small { font-weight: 500; opacity: .85; font-size: 9.5px; }
.slot.selected { outline: 3px solid var(--text); outline-offset: 1px; }
.slot.target:not(.filled) { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.slot[data-band="GK"].filled { color: #1b1b1b; }

.validation:empty { display: none; }
.validation { margin-top: 8px; display: flex; flex-direction: column; gap: 4px; }
.validation .msg { font-size: 12px; padding: 6px 8px; border-radius: 6px; }
.validation .err { background: var(--err-bg); color: var(--danger); }
.validation .warn { background: var(--warn-bg); color: var(--warn); }

/* lista de jogadores */
.player-list { display: flex; flex-direction: column; gap: 6px; }
.prow { display: grid; grid-template-columns: 22px 40px minmax(0, 1fr) 80px 38px; gap: 5px; align-items: center; }
.prow .num {
  width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center;
  font-size: 11px; font-weight: 700; color: #fff;
}
.prow .num[data-band="GK"] { color: #1b1b1b; }
.prow .slotname { font-size: 12px; font-weight: 600; color: var(--muted); }
.pi-btn {
  border: 1px solid var(--border); background: var(--panel-2); border-radius: 7px; min-height: 30px;
  font-size: 11px; font-weight: 700; color: var(--muted); cursor: pointer; padding: 0 2px; white-space: nowrap;
}
.pi-btn.has { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.pi-btn.open { outline: 2px solid var(--accent); outline-offset: 1px; }
.pi-box { margin: 0 0 6px 27px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel-2); }
.pi-box .check { font-size: 12.5px; margin: 4px 0; }
.pi-box .check.disabled { color: var(--muted); opacity: .7; cursor: not-allowed; }
.pi-box .check.locked { opacity: 1; color: var(--text); }
.pi-box .check.locked small { color: var(--accent); font-weight: 600; }
.pi-box .pi-text { flex: 1; min-width: 0; }
.pi-box .check small { display: block; color: var(--muted); font-size: 11.5px; }
.pi-group { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 6px 0 2px; }
.pi-group:first-child { margin-top: 0; }
.pi-box .check small.warn-note { color: var(--warn); }
.btn.small { min-height: 28px; padding: 3px 10px; font-size: 12px; margin-top: 6px; }
.prow select { font-size: 12.5px; padding: 4px 6px; min-height: 30px; width: 100%; }

.ti-form { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.ti-form label { display: grid; gap: 3px; font-size: 12.5px; color: var(--muted); }
.ti-form select { color: var(--text); }
.ti-form label.check { display: flex; color: var(--text); }

/* área principal */
.main { min-width: 0; }
.main-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.tabs { display: none; gap: 4px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 3px; }
.tab { border: 0; background: transparent; padding: 6px 10px; border-radius: 7px; cursor: pointer; font-size: 13px; }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }

.fields { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.fields .field-card.out-group { display: none; }
.groups { display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 3px; }
.groups .tab[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.main-bar { flex-wrap: wrap; }
.field-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 10px; box-shadow: var(--shadow); min-width: 0; }
.field-card h3 { margin: 0 0 8px; font-size: 14px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.field-card h3 span { font-size: 11.5px; color: var(--muted); font-weight: 500; }
.info { min-height: 34px; margin: 8px 0 0; font-size: 12px; color: var(--muted); }
.info b { color: var(--text); }
.info .desc { display: block; margin-top: 4px; color: var(--text); opacity: .85; }

svg.pitch { width: 100%; height: auto; display: block; border-radius: 8px; touch-action: none; user-select: none; }
.pitch .stripe-a { fill: var(--pitch-a); }
.pitch .stripe-b { fill: var(--pitch-b); }
.pitch .ln { fill: none; stroke: var(--pitch-line); stroke-width: .32; }
.pitch .third { stroke: rgba(255, 255, 255, .22); stroke-width: .25; stroke-dasharray: 1 1; }
.pitch .spot { fill: var(--pitch-line); }
.pitch .ball { fill: #fff; stroke: #111; stroke-width: .25; }
.pitch .ghost { fill: none; stroke: rgba(255, 255, 255, .7); stroke-width: .25; stroke-dasharray: .7 .5; }
.pitch .arrow { stroke: rgba(255, 255, 255, .75); stroke-width: .3; fill: none; }
.pitch .arrowhead { fill: rgba(255, 255, 255, .85); }
.pitch g.pl { transition: transform .45s ease; cursor: default; }
.pitch.anim g.pl { transition: transform 1.1s cubic-bezier(.45, 0, .2, 1); }
.pitch.editing g.pl { cursor: grab; }
.pitch g.pl.dragging { transition: none; cursor: grabbing; }
.pitch g.pl.dragging .pc { stroke: #ffeb3b; stroke-width: .5; }
.pitch .pc { stroke: #fff; stroke-width: .32; }
.pitch .ab { fill: #fff; font-weight: 800; text-anchor: middle; dominant-baseline: central; letter-spacing: -.03em; pointer-events: none; }
.pitch .pl[data-band="GK"] .ab { fill: #1b1b1b; }
.pitch .nb { fill: #0f1512; stroke: #fff; stroke-width: .18; }
.pitch .no { fill: #fff; font-size: 1.25px; font-weight: 700; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.pitch .zone { fill-opacity: .16; stroke-opacity: .7; stroke-width: .3; stroke-dasharray: .8 .6; pointer-events: none; }
.pitch g.op { transition: transform .45s ease; }
.pitch.anim g.op { transition: transform 1.1s cubic-bezier(.45, 0, .2, 1); }
.pitch .oc { fill: #f3f4f6; stroke: #111827; stroke-width: .3; }
.pitch .oab { fill: #111827; font-weight: 800; text-anchor: middle; dominant-baseline: central; letter-spacing: -.03em; pointer-events: none; }
.opp-line { margin: -4px 0 8px; font-size: 12px; color: var(--muted); }
.shape-line { margin: -4px 0 6px; font-size: 12px; color: var(--text); font-variant-numeric: tabular-nums; }
.opp-form.off { opacity: .55; }
.pitch .shape-line-us { fill: none; stroke: rgba(255, 255, 255, .55); stroke-width: .35; stroke-linejoin: round; }
.pitch .shape-line-opp { fill: none; stroke: rgba(17, 24, 39, .45); stroke-width: .3; stroke-dasharray: 1 .6; stroke-linejoin: round; }
.pitch .pi-dot { fill: #fff; stroke: #0f1512; stroke-width: .2; }
.pitch .pl.hl .pc { stroke: #ffeb3b; stroke-width: .55; }

.anim-view { max-width: 560px; margin: 0 auto; }
.anim-head { display: flex; justify-content: center; margin-bottom: 10px; }
.anim-steps { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.anim-steps span { padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border); font-size: 12.5px; color: var(--muted); background: var(--panel); }
.anim-steps span.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }

.legend { color: var(--muted); font-size: 12px; margin: 12px 2px 0; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }

.toast {
  position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(20px);
  background: var(--text); color: var(--bg); padding: 9px 14px; border-radius: 10px; font-size: 13px;
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: calc(100vw - 32px); z-index: 20;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.fatal { max-width: 640px; margin: 40px auto; padding: 16px; background: var(--err-bg); color: var(--danger); border-radius: 12px; }
.fatal code { background: rgba(0,0,0,.06); padding: 1px 5px; border-radius: 4px; }

/* Abaixo de 1280px os 3 campos lado a lado ficam pequenos demais: vira abas. */
@media (max-width: 1279px) {
  .tabs { display: flex; overflow-x: auto; max-width: 100%; scrollbar-width: none; }
  .tabs .tab { white-space: nowrap; }
  .groups { display: none; }
  .fields .field-card.out-group.active { display: block; }
  .fields { grid-template-columns: minmax(0, 1fr); max-width: 560px; }
  .fields .field-card:not(.active) { display: none; }
  .layout.collapsed .fields { margin: 0 auto; }
}
@media (max-width: 860px) {
  .layout { grid-template-columns: minmax(0, 1fr); padding: 12px 16px; }
  .panel { position: static; max-height: none; overflow: visible; order: 2; }
  .main { order: 1; }
  .fields { max-width: none; }
  .brand p { display: none; }
}
@media (max-width: 400px) {
  .prow { grid-template-columns: 22px 36px minmax(0, 1fr) 76px 36px; gap: 4px; }
  .tab { padding: 6px 7px; font-size: 12px; }
  .main-bar .btn { padding: 6px 9px; }
}
</style>
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="togglePanel" aria-label="Mostrar/ocultar painel" title="Mostrar/ocultar painel">☰</button>
    <div class="brand">
      <h1>FM23 Positioning Viewer</h1>
      <p>Modelo heurístico por regras — representa o comportamento típico de cada função, não o motor do jogo.</p>
    </div>
  </header>

  <div class="layout" id="layout">
    <aside class="panel" id="panel">
      <section class="card">
        <h2>Formação</h2>
        <div class="row">
          <select id="preset" aria-label="Formação pré-definida"></select>
          <button id="applyPreset" class="btn primary">Aplicar</button>
        </div>
        <div id="slotGrid" class="slot-grid" aria-label="Editor de formação"></div>
        <p class="hint">Clique num jogador e depois num slot vazio para movê-lo.</p>
        <div id="validation" class="validation" aria-live="polite"></div>
      </section>

      <section class="card">
        <h2>Funções e tarefas</h2>
        <div id="playerList" class="player-list"></div>
      </section>

      <section class="card">
        <h2>Instruções de equipe</h2>
        <div id="tiForm" class="ti-form"></div>
      </section>

      <section class="card">
        <h2>Adversário</h2>
        <label class="check"><input type="checkbox" id="oppEnabled"> Mostrar o time adversário nas 3 fases</label>
        <div id="oppForm" class="ti-form opp-form"></div>
      </section>

      <section class="card">
        <h2>Visualização</h2>
        <label class="check"><input type="checkbox" id="optShape"> Mostrar linhas de estrutura e medidas</label>
        <label class="check"><input type="checkbox" id="optGhost"> Mostrar posição base (fantasma) e seta</label>
        <label class="check"><input type="checkbox" id="optEdit"> Modo editar regra (arrastar jogador grava override)</label>
      </section>

      <section class="card">
        <h2>Arquivos</h2>
        <div class="btn-grid">
          <button class="btn" id="exportTactic">Exportar tática</button>
          <button class="btn" id="importTactic">Importar tática</button>
          <button class="btn" id="exportRoles">Exportar roles.json</button>
          <button class="btn" id="importRoles">Importar roles.json</button>
          <button class="btn danger" id="resetTactic">Resetar tática</button>
          <button class="btn danger" id="resetRoles">Resetar regras</button>
        </div>
        <p class="hint" id="rolesStatus"></p>
        <input type="file" id="fileTactic" accept="application/json,.json" hidden>
        <input type="file" id="fileRoles" accept="application/json,.json" hidden>
      </section>
    </aside>

    <main class="main">
      <div class="main-bar">
        <div class="groups" role="group" aria-label="Fases exibidas" id="groups">
          <button class="tab" data-group="sem">Sem a bola</button>
          <button class="tab" data-group="com">Com a bola</button>
          <button class="tab" data-group="todas">Todas</button>
        </div>
        <div class="tabs" role="tablist" id="tabs"></div>
        <button class="btn primary" id="animate">▶ Animar</button>
      </div>
      <div class="fields" id="fields"></div>
      <div class="anim-view" id="animView" hidden>
        <div class="anim-head">
          <div class="anim-steps" id="animSteps"></div>
        </div>
        <div class="field-card"><svg class="pitch anim" id="animSvg" role="img" aria-label="Animação entre as fases"></svg></div>
      </div>
      <p class="legend" id="legend"></p>
    </main>
  </div>

  // ---------- slots ----------

  function slotInfo(formations, slot) {
    var s = formations.slots[slot];
    if (!s) throw new Error('Slot desconhecido: ' + slot);
    var x;
    if (s.band === 'GK') x = 50;
    else if (s.band === 'ST') x = formations.stLaneX[s.lane];
    else x = formations.laneX[s.lane];
    var side = s.lane === 'L' || s.lane === 'CL' ? 'L' : s.lane === 'C' ? 'C' : 'R';
    return { slot: slot, band: s.band, lane: s.lane, x: x, y: formations.bandY[s.band], side: side };
  }

  function slotOrder(formations, slot) {
    var s = formations.slots[slot];
    return BAND_ORDER.indexOf(s.band) * 10 + LANE_ORDER.indexOf(s.lane);
  }

  /** Numeração 1..11: GK primeiro, depois por faixa (trás → frente) e corredor (esq → dir). */
  function numberPlayers(players, formations) {
    var sorted = players
      .map(function (p, i) { return { i: i, o: slotOrder(formations, p.slot) }; })
      .sort(function (a, b) { return a.o - b.o; });
    var nums = new Array(players.length);
    sorted.forEach(function (s, k) { nums[s.i] = k + 1; });
    return nums;
  }

  function rolesForSlot(roles, slot) {
    return Object.keys(roles).filter(function (k) {
      return (roles[k].slots || []).indexOf(slot) >= 0;
    });
  }

  function isCentreBack(formations, slot) {
    var s = formations.slots[slot];
    return s && s.band === 'D' && CENTRAL_LANES.indexOf(s.lane) >= 0;
  }

  // ---------- validação ----------

  function validate(players, data) {
    var formations = data.formations, roles = data.roles;
    var errors = [], warnings = [];
    if (!Array.isArray(players)) return { ok: false, errors: ['Lista de jogadores inválida.'], warnings: [] };
    if (players.length !== 11) errors.push('A tática precisa de exatamente 11 jogadores (tem ' + players.length + ').');

    var seen = {}, gk = 0, centralByBand = {}, cbCount = 0;
    players.forEach(function (p) {
      if (!p || !formations.slots[p.slot]) { errors.push('Slot desconhecido: ' + (p && p.slot)); return; }
      if (seen[p.slot]) errors.push('Slot repetido: ' + p.slot);
      seen[p.slot] = true;
      var s = formations.slots[p.slot];
      if (s.band === 'GK') gk++;
      if (CENTRAL_LANES.indexOf(s.lane) >= 0 && s.band !== 'GK') {
        centralByBand[s.band] = (centralByBand[s.band] || 0) + 1;
      }
      if (isCentreBack(formations, p.slot)) cbCount++;

      var role = roles[p.role];
      if (!role) { errors.push(p.slot + ': função desconhecida "' + p.role + '".'); return; }
      if ((role.slots || []).indexOf(p.slot) < 0) errors.push(p.slot + ': ' + role.label + ' não é válida neste slot.');
      if (!role.duties || !role.duties[p.duty]) errors.push(p.slot + ': tarefa "' + p.duty + '" inválida para ' + role.label + '.');
    });
    if (gk !== 1) errors.push('A tática precisa de exatamente 1 goleiro (tem ' + gk + ').');
    Object.keys(centralByBand).forEach(function (b) {
      if (centralByBand[b] > 3) errors.push('No máximo 3 jogadores centrais na faixa ' + b + '.');
    });
    players.forEach(function (p) {
      var role = roles[p.role];
      if (role && role.requiresBack3 && cbCount !== 3) {
        warnings.push(p.slot + ': ' + role.label + ' só faz sentido numa linha de 3 zagueiros.');
      }
      if (!formations.slots[p.slot]) return;
      var pis = (data.playerInstructions || {}).instructions || {};
      var info = slotInfo(formations, p.slot);
      if (p.traits && p.traits.length) {
        var tdefs = (data.playerTraits || {}).traits || {};
        var applied = resolvePlayerInstructions(p, info, pis, roles).applied;
        var t = resolveTraits(p, info, tdefs, applied.concat(lockedFor(roles, p)));
        t.unknown.forEach(function (k) { warnings.push(p.slot + ': característica desconhecida "' + k + '".'); });
        t.ignored.forEach(function (i) { warnings.push(p.slot + ': "' + tdefs[i.key].label + '" sem efeito — ' + i.reason + '.'); });
      }
      if (!p.instructions || !p.instructions.length) return;
      var r = resolvePlayerInstructions(p, info, pis, roles);
      r.unknown.forEach(function (k) { warnings.push(p.slot + ': instrução individual desconhecida "' + k + '".'); });
      r.ignored.forEach(function (i) { warnings.push(p.slot + ': "' + pis[i.key].label + '" ignorada — ' + i.reason + '.'); });
    });
    return { ok: errors.length === 0, errors: errors, warnings: warnings };
  }

  // ---------- instruções de equipe ----------

  function pick(def, idx) {
    if (idx == null || !def.options[idx]) idx = def.default;
    return def.options[idx];
  }

  function resolveInstructions(instructions, ti) {
    ti = ti || {};
    var flags = {};
    Object.keys(instructions.flags || {}).forEach(function (k) {
      flags[k] = ti.flags && k in ti.flags ? !!ti.flags[k] : !!instructions.flags[k].default;
    });
    return {
      mentalityDy: pick(instructions.mentality, ti.mentality).dy,
      defLineY: pick(instructions.defensiveLine, ti.defensiveLine).y,
      loeDy: pick(instructions.lineOfEngagement, ti.lineOfEngagement).dy,
      widthFactor: pick(instructions.widthInPossession, ti.widthInPossession).factor,
      defWidthFactor: instructions.defensiveWidth ? pick(instructions.defensiveWidth, ti.defensiveWidth).factor : null,
      mentalityIdx: instructions.mentality.options[ti.mentality] ? ti.mentality : instructions.mentality.default,

  }

  // ---------- regras de função ----------

  /**
   * Tarefa efetiva para buscar regras: "Automático" segue a mentalidade
   * (engine.autoDutyByMentality), a menos que a própria tarefa Au tenha regra para a fase.
   */
  function effectiveDuty(roles, p, phase, ti, eng) {
    var role = roles[p.role];
    if (!role || p.duty !== 'Au') return p.duty;
    var own = role.duties.Au && role.duties.Au[phase];
    var map = eng && eng.autoDutyByMentality;
    if ((own && Object.keys(own).length) || !map) return 'Au';
    var d = map[ti.mentalityIdx];
    return role.duties[d] ? d : 'Au';
  }

  function getRule(roles, p, phase, flags, duty) {
    var role = roles[p.role];
    var dutyRules = role && role.duties && role.duties[duty || p.duty];
    var rule = dutyRules && dutyRules[phase];
    if (!rule) return null;
    if (rule.if && !flags[rule.if]) return null;
    if (rule.onlyBands && rule.onlyBands.indexOf(p.band) < 0) return null;
    if (rule.byBand) {
      // variação por faixa (ex.: DLP no volante x no meio-campo): a parte da faixa sobrescreve a base
      var merged = {};
      Object.keys(rule).forEach(function (k) { if (k !== 'byBand') merged[k] = rule[k]; });
      var extra = rule.byBand[p.band] || {};
      Object.keys(extra).forEach(function (k) { merged[k] = extra[k]; });
      return merged;
    }
    return rule;
  }

  // ---------- instruções individuais (PIs) ----------

  var BAND_NAMES = { GK: 'goleiro', D: 'defesa', DM: 'meio-defensivo', M: 'meio', AM: 'meia ofensivo', ST: 'ataque' };

  /** A instrução `def` está disponível para o jogador `p` no slot descrito por `info`? */
  /** Instruções que a função+tarefa já traz embutidas no jogo (campo "locked" da tarefa em roles.json). */
  function lockedFor(roles, p) {
    var role = roles && roles[p.role];
    var duty = role && role.duties && role.duties[p.duty];
    return (duty && duty.locked) || [];
  }

  function piAvailability(def, p, info, roles, key) {
    var locked = lockedFor(roles, p);
    if (key && locked.indexOf(key) >= 0) return { ok: false, locked: true, reason: 'já embutida na função' };
    var clash = (def.excludes || []).filter(function (k) { return locked.indexOf(k) >= 0; })[0];
    if (clash) return { ok: false, reason: 'conflita com uma instrução embutida na função' };
    if (def.notBands && def.notBands.indexOf(info.band) >= 0) return { ok: false, reason: 'não disponível para ' + BAND_NAMES[info.band] };
    if (def.bands && def.bands.indexOf(info.band) < 0) return { ok: false, reason: 'só para ' + def.bands.map(function (b) { return BAND_NAMES[b]; }).join('/') };
    if (def.lanes && def.lanes.indexOf(info.lane) < 0) return { ok: false, reason: 'não disponível neste corredor' };
    if (def.sides && def.sides.indexOf(info.side) < 0) return { ok: false, reason: 'só para jogadores com lado definido (não central)' };
    if (def.excludeRoles && def.excludeRoles.indexOf(p.role) >= 0) return { ok: false, reason: 'já embutida na função' };
    return { ok: true };
  }

  /** Separa as PIs do jogador em aplicadas, ignoradas (indisponíveis/conflitantes) e desconhecidas. */
  function resolvePlayerInstructions(p, info, pis, roles) {
    var applied = [], ignored = [], unknown = [];
    (p.instructions || []).forEach(function (k) {
      var def = pis[k];
      if (!def) { unknown.push(k); return; }
      var av = piAvailability(def, p, info, roles, k);
      if (!av.ok) { ignored.push({ key: k, reason: av.reason }); return; }
      var clash = applied.filter(function (a) {
        return (def.excludes || []).indexOf(a) >= 0 || (pis[a].excludes || []).indexOf(k) >= 0;
      })[0];
      if (clash) { ignored.push({ key: k, reason: 'conflita com "' + pis[clash].label + '"' }); return; }
      applied.push(k);
    });
    return { applied: applied, ignored: ignored, unknown: unknown };
  }

  // ---------- características do jogador (Player Traits) ----------

  /**
   * Características ativas: disponíveis no slot, sem conflito entre si e não anuladas por
   * uma instrução individual/embutida listada em overriddenBy (o manual: "can be overridden by Player Instructions").
   */
  function resolveTraits(p, info, defs, activePIs) {
    var applied = [], ignored = [], unknown = [];
    (p.traits || []).forEach(function (k) {
      var def = defs[k];
      if (!def) { unknown.push(k); return; }
      var av = piAvailability(def, p, info);
      if (!av.ok) { ignored.push({ key: k, reason: av.reason }); return; }
      var over = (def.overriddenBy || []).filter(function (x) { return activePIs.indexOf(x) >= 0; })[0];
      if (over) { ignored.push({ key: k, reason: 'uma instrução (individual ou embutida na função) prevalece', overriddenBy: over }); return; }
      var clash = applied.filter(function (a) {
        return (def.excludes || []).indexOf(a) >= 0 || (defs[a].excludes || []).indexOf(k) >= 0;
      })[0];
      if (clash) { ignored.push({ key: k, reason: 'conflita com "' + defs[clash].label + '"' }); return; }
      applied.push(k);
    });
    return { applied: applied, ignored: ignored, unknown: unknown };
  }

  // ---------- efeitos especiais ----------

  function centreBacks(list) {
    return list.filter(function (p) { return p.isCB; }).sort(function (a, b) { return a.baseX - b.baseX; });
  }

  var EFFECTS = {
    /** DCs abrem para x 25/75 e y 13 (Half-Back e, opcionalmente, DLP-D). */
    split_cbs_wide: function (list) {
      var dcs = centreBacks(list);
      if (!dcs.length) return;
      dcs.forEach(function (d) { d.by = 13; });
      if (dcs.length >= 2) {
        dcs[0].bx = 25;
        dcs[dcs.length - 1].bx = 75;
      }
    },
    /** Com um Ala Invertido de um lado, o DC daquele lado abre +5 em x na saída de bola. */
    fullback_hold: function (list, phase, source) {
      if (phase !== 'saindo' || source.side === 'C') return;
      var dcs = centreBacks(list);
      if (!dcs.length) return;
      var target = source.side === 'L' ? dcs[0] : dcs[dcs.length - 1];
      if (target.side !== source.side) return;
      target.bx += source.side === 'L' ? -5 : 5;
    },
    /** Lateral Invertido entra na linha dos zagueiros: os DCs deslizam para o lado oposto, formando uma linha de 3. */
    ifb_back_three: function (list, phase, source) {
      if (source.side === 'C') return;
      var shift = source.side === 'L' ? 10 : -10;
      centreBacks(list).forEach(function (d) { d.bx += shift; });
    }
  };

  function registerEffect(name, fn) { EFFECTS[name] = fn; }

  // ---------- colisão / clamp ----------

  /**
   * Afasta pares a menos de minDist. `aspect` = [ax, ay] mede a distância num espaço escalado
   * (ex.: [0.68, 1.05] = metros num campo 68×105); [1, 1] = unidades normalizadas puras.
   */
  function resolveCollisions(pts, minDist, iterations, aspect) {
    minDist = minDist == null ? 6 : minDist;
    iterations = iterations == null ? 5 : iterations;
    var ax = aspect ? aspect[0] : 1, ay = aspect ? aspect[1] : 1;
    for (var it = 0; it < iterations; it++) {
      var moved = false;
      for (var i = 0; i < pts.length; i++) {
        for (var j = i + 1; j < pts.length; j++) {
          var a = pts[i], b = pts[j];
          var vx = (b.x - a.x) * ax, vy = (b.y - a.y) * ay;
          var d = Math.sqrt(vx * vx + vy * vy);
          if (d >= minDist) continue;
          var ux, uy;
          if (d < 1e-6) { ux = (i + j) % 2 ? 1 : -1; uy = 0; } // vetor determinístico p/ pontos coincidentes
          else { ux = vx / d; uy = vy / d; }
          var push = (minDist - d) / 2;
          a.x -= ux * push / ax; a.y -= uy * push / ay;
          b.x += ux * push / ax; b.y += uy * push / ay;
          moved = true;
        }
      }
      if (!moved) break;
    }
    return pts;
  }

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  /** Zona de liberdade (elipse rx × ry, unidades normalizadas) em volta da posição média. */
  function addZone(p, rx, ry) {
    if (!p.zone) p.zone = { rx: 0, ry: 0 };
    p.zone.rx = Math.max(p.zone.rx, rx);
    p.zone.ry = Math.max(p.zone.ry, ry);
  }

  // ---------- pipeline ----------

  /**
   * Calcula as posições de uma fase.
   * Ordem efetiva: base(slot) → fase da equipe → override/delta da função → efeitos
   *                → instruções de equipe (aplicadas como deslocamento sobre o resultado)
   *                → deltas da função → colisão → clamp.
   * As instruções vêm depois do override para que mentalidade/linha/largura
   * continuem valendo para jogadores com posição absoluta na regra.
   */
  function isWithBall(formations, phase) {
    var ph = formations.phases[phase];
    return ph && ph.withBall != null ? !!ph.withBall : phase !== 'defendendo';
  }

  /**
   * Fase derivada de outra(s) (data.formations.phases[fase].derive):
   *  - blend: mistura posição a posição duas fases já calculadas (ex.: progressão = entre saída e ataque);
   *  - from: desloca uma fase por faixa, ancora a linha D, estreita e soma o efeito de pressão.
   * Regras de função com a chave desta fase entram como deslocamento extra (dx espelhado, dy).
   */
  function computeDerived(players, phase, data, tiState) {
    var formations = data.formations, roles = data.roles;
    var ph = formations.phases[phase], d = ph.derive;
    var eng = data.instructions.engine || {};
    var ti = resolveInstructions(data.instructions, tiState);
    var list;
    if (d.blend) {
      var A = computePhase(players, d.blend[0], data, tiState).players;
      var B = computePhase(players, d.blend[1], data, tiState).players;
      var t = d.t == null ? 0.5 : d.t;
      list = B.map(function (pb, i) {
        var pa = A[i], p = Object.assign({}, pb);
        p.x = pa.x + (pb.x - pa.x) * t;
        p.y = pa.y + (pb.y - pa.y) * t;
        p.zone = pb.zone || pa.zone;
        p.offside = false;
        return p;
      });
    } else {
      list = computePhase(players, d.from, data, tiState).players.map(function (p) { return Object.assign({}, p, { offside: false }); });
      var anchor = 0;
      if (d.lineY != null) {
        var defs = list.filter(function (p) { return p.band === 'D'; });
        if (!defs.length) defs = list.filter(function (p) { return p.band !== 'GK'; });
        anchor = d.lineY - Math.min.apply(null, defs.map(function (p) { return p.y; }));
      }
      list.forEach(function (p) {
        if (p.band === 'GK') { p.y += (d.shiftByBand && d.shiftByBand.GK) || 0; return; }
        p.y += anchor + ((d.shiftByBand && d.shiftByBand[p.band]) || 0);
        if (d.widthScale) p.x = 50 + (p.x - 50) * d.widthScale;
        if (d.press) {
          var keys = (p.instructions || []).concat(p.locked || []);
          if (keys.indexOf('close_down_more') >= 0) p.y += d.press.more || 0;
          if (keys.indexOf('close_down_less') >= 0) p.y += d.press.less || 0;
        }
      });
    }
    list.forEach(function (p) {
      p.derivedDx = 0; p.derivedDy = 0;
      var rule = getRule(roles, p, phase, ti.flags, p.effDuty);
      if (!rule) return;
      p.rule = rule;
      if (rule.dx && p.side !== 'C') { p.derivedDx = rule.dx; p.x += p.side === 'R' ? -rule.dx : rule.dx; }
      if (rule.dy) { p.derivedDy = rule.dy; p.y += rule.dy; }
    });
    resolveCollisions(list, eng.collisionMinDist, eng.collisionIterations, eng.collisionAspect);
    var lo = (eng.clamp || [2, 98])[0], hi = (eng.clamp || [2, 98])[1];
    list.forEach(function (p) {
      p.x = Math.round(clamp(p.x, lo, hi) * 10) / 10;
      p.y = Math.round(clamp(p.y, lo, hi) * 10) / 10;
    });
    return { phase: phase, players: list, ball: ph.ball || null, warnings: [], derived: true };
  }

  function computePhase(players, phase, data, tiState) {
    var formations = data.formations, roles = data.roles, instructions = data.instructions;
    var ph = formations.phases[phase];
    if (!ph) throw new Error('Fase desconhecida: ' + phase);
    if (ph.derive) return computeDerived(players, phase, data, tiState);
    var eng = instructions.engine || {};
    var ti = resolveInstructions(instructions, tiState);
    var withBall = isWithBall(formations, phase);
    var nums = numberPlayers(players, formations);
    var pis = (data.playerInstructions || {}).instructions || {};
    var tdefs = (data.playerTraits || {}).traits || {};
    var defaultLineY = formations.phases.defendendo.y.D;
    var defLineWithBall = eng.defLineWithBallFactor == null ? 1 : eng.defLineWithBallFactor;

    // 1. posição base + transformação de fase
    var list = players.map(function (p, i) {
      var info = slotInfo(formations, p.slot);
      return {
        index: i, num: nums[i], slot: p.slot, role: p.role, duty: p.duty,
        band: info.band, lane: info.lane, side: info.side,
        baseX: info.x, baseY: info.y,
        isCB: isCentreBack(formations, p.slot),
        bx: 50 + (info.x - 50) * (withBall || !ti.defWidthFactor ? ph.width : ti.defWidthFactor),
        by: ph.y[info.band],
        dx: 0, dy: 0, inside: 0, outside: 0, latShift: 0, rule: null,
        instructions: resolvePlayerInstructions(p, info, pis, roles).applied,
        locked: lockedFor(roles, p).slice(),
        traits: [],
        zone: null, touch: null, effDuty: p.duty

    });

    if (ph.cbSplit) {
      var dcs = centreBacks(list), xs = ph.cbSplit[String(dcs.length)];
      if (xs) dcs.forEach(function (d, k) { d.bx = xs[k]; });
    }

    // 2. regras de função + tarefa (x escrito para o lado esquerdo, espelhado à direita)
    var pending = [];
    list.forEach(function (p) {
      p.effDuty = effectiveDuty(roles, p, phase, ti, eng);
      var rule = getRule(roles, p, phase, ti.flags, p.effDuty);
      if (!rule) return;
      p.rule = rule;
      var mirror = p.side === 'R';
      if (rule.x != null && p.side !== 'C') p.bx = mirror ? 100 - rule.x : rule.x;
      if (rule.y != null) p.by = rule.y;
      if (rule.dx && p.side !== 'C') p.dx = mirror ? -rule.dx : rule.dx;
      if (rule.dy) p.dy = rule.dy;
      if (rule.inside && p.side !== 'C') p.inside = rule.inside === true ? (eng.insideDefault || 8) : rule.inside;
      if (rule.outside && p.side !== 'C') p.outside = rule.outside;
      if (rule.roam) addZone(p, rule.roam, rule.roam);
      if (rule.lateral) addZone(p, rule.lateral, rule.lateralY || 3);
      (rule.effects || []).forEach(function (e) { pending.push({ name: e, source: p }); });
    });

    // 2b. instruções individuais: somam deltas por fase (dx espelhado; inside/outside relativos ao centro).
    //     As embutidas na função só contribuem com zonas (deambular/corredores): o deslocamento delas
    //     já está nas regras da função em roles.json.
    //     Características do jogador (traits) entram do mesmo jeito, depois das instruções.
    list.forEach(function (p) {
      var wideLane = p.lane === 'L' || p.lane === 'R';
      var src = players[p.index];
      p.traits = resolveTraits(src, slotInfo(formations, p.slot), tdefs, p.instructions.concat(p.locked)).applied;
      var noChannels = p.traits.some(function (k) { return tdefs[k].suppressChannels; });
      var moves = p.instructions.map(function (k) { return pis[k]; }).concat(p.traits.map(function (k) { return tdefs[k]; }));
      moves.forEach(function (def) {
        var eff = def.phases && def.phases[phase];
        if (!eff) return;
        if (eff.dx && p.side !== 'C') p.dx += p.side === 'R' ? -eff.dx : eff.dx;
        if (eff.dy) p.dy += eff.dy;
        if (eff.inside && p.side !== 'C') p.inside += eff.inside;
        if (eff.touchline != null && wideLane) p.touch = eff.touchline;
        else if (eff.wideInside && wideLane) { if (!noChannels) p.inside += eff.wideInside; }
        else if (eff.outside && p.side !== 'C' && !(noChannels && eff.centerSpread)) p.outside += eff.outside;
      });
      p.locked.map(function (k) { return pis[k]; }).concat(moves).forEach(function (def) {
        var eff = def && def.phases && def.phases[phase];
        if (!eff) return;
        if (eff.roam) addZone(p, eff.roam, eff.roam);
        if (eff.centerSpread && p.side === 'C' && !noChannels) addZone(p, eff.centerSpread, eff.centerSpreadY || 4);
      });
    });

    // 3. efeitos sobre outros jogadores
    var warnings = [];
    pending.forEach(function (e) {
      var fn = EFFECTS[e.name];
      if (fn) fn(list, phase, e.source);
      else warnings.push('Efeito desconhecido: ' + e.name);
    });

    // 4. instruções de equipe + deltas da função
    list.forEach(function (p) {
      p.tiW = withBall ? ti.widthFactor : 1;
      if (p.band === 'GK') p.tiDy = 0;
      else if (withBall) {

    $('optShape').addEventListener('change', function (e) { ui.shapes = e.target.checked; renderFields(); saveState(); });
    $('optGhost').checked = ui.ghost;
    $('optGhost').addEventListener('change', function (e) { ui.ghost = e.target.checked; renderFields(); saveState(); });
    $('optEdit').addEventListener('change', function (e) {
      ui.edit = e.target.checked;
      document.querySelectorAll('.fields svg.pitch').forEach(function (s) { s.classList.toggle('editing', ui.edit); });
      if (ui.edit) toast('Modo editar: arraste um jogador para gravar a posição como override da função+tarefa naquela fase.', 5000);
    });

    $('togglePanel').addEventListener('click', function () {
      ui.collapsed = !ui.collapsed;
      $('layout').classList.toggle('collapsed', ui.collapsed);
      saveState();
    });
    $('layout').classList.toggle('collapsed', ui.collapsed);

    $('animate').addEventListener('click', toggleAnim);

    $('exportTactic').addEventListener('click', function () {
      download('tatica-fm23-' + state.presetId + '.json', {
        format: 'fm23pv-tactic', version: 1, presetId: state.presetId, players: state.players, ti: state.ti, opp: state.opp
      });
    });
    $('importTactic').addEventListener('click', function () { $('fileTactic').click(); });
    $('fileTactic').addEventListener('change', function (e) {
      readJsonFile(e.target, function (obj) {
        if (!obj || !Array.isArray(obj.players)) { toast('Arquivo não parece uma tática exportada por este site.', 5000); return; }
        var v = E.validate(obj.players, data);
        if (!v.ok) { toast('Tática inválida: ' + v.errors[0], 6000); return; }
        state = {
          presetId: obj.presetId || state.presetId,
          players: obj.players.map(function (p) {
            var q = { slot: p.slot, role: p.role, duty: p.duty };
            if (Array.isArray(p.instructions) && p.instructions.length) q.instructions = p.instructions.filter(function (k) { return typeof k === 'string'; });
            if (Array.isArray(p.traits) && p.traits.length) q.traits = p.traits.filter(function (k) { return typeof k === 'string'; });
            return q;
          }),
          ti: Object.assign(defaultTI(), obj.ti || {}),
          opp: Object.assign(defaultOpp(), obj.opp || {})
        };
        renderAll(); syncTIForm(); syncOppForm();
        toast('Tática importada.');
      });
    });
    $('exportRoles').addEventListener('click', function () { download('roles.json', data.roles); });
    $('importRoles').addEventListener('click', function () { $('fileRoles').click(); });
    $('fileRoles').addEventListener('change', function (e) {
      readJsonFile(e.target, function (obj) {
        if (!isRolesObj(obj)) { toast('roles.json inválido: cada função precisa de label, slots e duties.', 6000); return; }
        data.roles = obj;
        lsSet(LS_ROLES, obj);
        state.players.forEach(fixPlayer);
        renderAll();
        toast('Regras importadas (' + Object.keys(obj).length + ' funções).');
      });
    });
    $('resetTactic').addEventListener('click', function () {
      if (!confirm('Voltar para a formação e instruções padrão?')) return;
      state = defaultState();
      ui.selectedSlot = null;
      renderAll(); syncTIForm(); syncOppForm();
    });
    $('resetRoles').addEventListener('click', function () {
      if (!confirm('Descartar todas as regras editadas/importadas e voltar ao data/roles.json original?')) return;
      data.roles = clone(baseRoles);
      lsSet(LS_ROLES, null);
      state.players.forEach(fixPlayer);
      renderAll();
      toast('Regras restauradas.');
    });

    window.addEventListener('pointermove', onDragMove);
    window.addEventListener('pointerup', onDragEnd);
    window.addEventListener('pointercancel', onDragCancel);
  }

  function buildTIForm() {
    var form = $('tiForm'), ins = data.instructions;
    ['mentality', 'defensiveLine', 'lineOfEngagement', 'widthInPossession', 'defensiveWidth'].forEach(function (key) {
      var def = ins[key];
      if (!def) return;
      var lab = el('label', null, def.label + ' (' + def.en + ')');
      var s = el('select', { 'data-key': key });
      def.options.forEach(function (o, i) { s.appendChild(el('option', { value: String(i) }, o.label + (o.en ? ' (' + o.en + ')' : ''))); });
      s.addEventListener('change', function () { state.ti[key] = Number(s.value); renderAll(); });
      lab.appendChild(s);
      form.appendChild(lab);
    });
    Object.keys(ins.flags || {}).forEach(function (k) {
      var lab = el('label', { class: 'check' });
      var cb = el('input', { type: 'checkbox', 'data-flag': k });
      cb.addEventListener('change', function () { state.ti.flags[k] = cb.checked; renderAll(); });
      lab.appendChild(cb);
      lab.appendChild(document.createTextNode(ins.flags[k].label));
      form.appendChild(lab);
    });
  }

  function buildOppForm() {
    var form = $('oppForm'), cfg = data.opponent;
    if (!cfg) { $('oppEnabled').closest('.card').hidden = true; return; }
    var lf = el('label', null, 'Formação do adversário');
    var fs = el('select', { id: 'oppPreset' });
    data.formations.presets.forEach(function (p) { fs.appendChild(el('option', { value: p.id }, p.label)); });
    fs.addEventListener('change', function () { state.opp.presetId = fs.value; renderAll(); });
    lf.appendChild(fs); form.appendChild(lf);

    var ls = el('label', null, 'Estilo de jogo do adversário');
    var ss = el('select', { id: 'oppStyle' });
    cfg.styles.forEach(function (st) { ss.appendChild(el('option', { value: st.id }, st.label + (st.inspiredBy ? ' (' + st.inspiredBy + ')' : ''))); });
    ss.addEventListener('change', function () { state.opp.styleId = ss.value; renderAll(); syncOppForm(); });
    ls.appendChild(ss); form.appendChild(ls);
    form.appendChild(el('p', { class: 'hint', id: 'oppDesc' }));

    $('oppEnabled').addEventListener('change', function (e) { state.opp.enabled = e.target.checked; renderAll(); syncOppForm(); });
  }

  function syncOppForm() {
    if (!data.opponent) return;
    var o = state.opp;
    $('oppEnabled').checked = !!o.enabled;
    $('oppPreset').value = o.presetId;
    $('oppStyle').value = o.styleId;
    $('oppForm').classList.toggle('off', !o.enabled);
    var st = E.opponentStyle(data, o.styleId);
    var ins = data.instructions;
    $('oppDesc').textContent = st ? st.desc + ' Instruções: mentalidade ' + ins.mentality.options[st.ti.mentality].label.toLowerCase() +
      ', linha defensiva ' + ins.defensiveLine.options[st.ti.defensiveLine].label.toLowerCase() +
      ', linha de pressão ' + ins.lineOfEngagement.options[st.ti.lineOfEngagement].label.toLowerCase() + '.' : '';
  }

  function syncTIForm() {
    document.querySelectorAll('#tiForm select').forEach(function (s) { s.value = String(state.ti[s.dataset.key]); });
    document.querySelectorAll('#tiForm input[data-flag]').forEach(function (cb) { cb.checked = !!(state.ti.flags || {})[cb.dataset.flag]; });
    $('preset').value = state.presetId;
  }

  function syncTabs() {
    var shown = groupPhases();
    document.querySelectorAll('#groups .tab').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.group === ui.group)); });
    document.querySelectorAll('#tabs .tab').forEach(function (t) { t.setAttribute('aria-selected', String(t.dataset.phase === ui.tab)); });
    document.querySelectorAll('#fields .field-card').forEach(function (c) {
      c.classList.toggle('active', c.dataset.phase === ui.tab);
      c.classList.toggle('out-group', shown.indexOf(c.dataset.phase) < 0);
    });
  }

  // ---------- campo SVG ----------

  function buildPitch(svg) {
    svg.setAttribute('viewBox', '0 0 ' + VW + ' ' + VH);
    var id = svg.id;
    var defs = svgEl('defs', {}, svg);
    var m = svgEl('marker', { id: 'ah-' + id, viewBox: '0 0 6 6', refX: '5', refY: '3', markerWidth: '4', markerHeight: '4', orient: 'auto-start-reverse' }, defs);
    svgEl('path', { d: 'M0,0 L6,3 L0,6 z', class: 'arrowhead' }, m);

    svgEl('rect', { x: 0, y: 0, width: VW, height: VH, class: 'stripe-b' }, svg);
    for (var i = 0; i < 10; i++) {
      svgEl('rect', { x: P, y: P + i * 10.5, width: 68, height: 10.5, class: i % 2 ? 'stripe-b' : 'stripe-a' }, svg);
    }
    var cx = P + 34, top = P, bot = P + 105;
    var g = svgEl('g', {}, svg);
    svgEl('line', { x1: P, x2: P + 68, y1: P + 35, y2: P + 35, class: 'third' }, g);
    svgEl('line', { x1: P, x2: P + 68, y1: P + 70, y2: P + 70, class: 'third' }, g);
    svgEl('rect', { x: P, y: P, width: 68, height: 105, class: 'ln' }, g);
    svgEl('line', { x1: P, x2: P + 68, y1: P + 52.5, y2: P + 52.5, class: 'ln' }, g);
    svgEl('circle', { cx: cx, cy: P + 52.5, r: 9.15, class: 'ln' }, g);
    svgEl('circle', { cx: cx, cy: P + 52.5, r: 0.4, class: 'spot' }, g);
    // áreas, pequenas áreas, marcas do pênalti, meia-luas e gols
    svgEl('rect', { x: cx - 20.16, y: top, width: 40.32, height: 16.5, class: 'ln' }, g);
    svgEl('rect', { x: cx - 20.16, y: bot - 16.5, width: 40.32, height: 16.5, class: 'ln' }, g);
    svgEl('rect', { x: cx - 9.16, y: top, width: 18.32, height: 5.5, class: 'ln' }, g);
    svgEl('rect', { x: cx - 9.16, y: bot - 5.5, width: 18.32, height: 5.5, class: 'ln' }, g);
    svgEl('circle', { cx: cx, cy: top + 11, r: 0.35, class: 'spot' }, g);
    svgEl('circle', { cx: cx, cy: bot - 11, r: 0.35, class: 'spot' }, g);
    svgEl('path', { d: 'M' + (cx - 7.31) + ',' + (top + 16.5) + ' A9.15,9.15 0 0 0 ' + (cx + 7.31) + ',' + (top + 16.5), class: 'ln' }, g);
    svgEl('path', { d: 'M' + (cx - 7.31) + ',' + (bot - 16.5) + ' A9.15,9.15 0 0 1 ' + (cx + 7.31) + ',' + (bot - 16.5), class: 'ln' }, g);
    svgEl('rect', { x: cx - 3.66, y: top - 1.6, width: 7.32, height: 1.6, class: 'ln' }, g);
    svgEl('rect', { x: cx - 3.66, y: bot, width: 7.32, height: 1.6, class: 'ln' }, g);

    svgEl('g', { class: 'zones' }, svg);
    svgEl('g', { class: 'shapes' }, svg);
    svgEl('g', { class: 'ghosts' }, svg);
    svgEl('g', { class: 'ball-layer' }, svg);
    svgEl('g', { class: 'opps' }, svg);
    svgEl('g', { class: 'players' }, svg);
  }

  function abbrFont(len) { return len <= 3 ? 1.9 : len === 4 ? 1.68 : len === 5 ? 1.45 : 1.25; }

  function playerTitle(cp) {
    var r = data.roles[cp.role], d = E.DUTIES[cp.duty] || { label: cp.duty, en: cp.duty };
    return cp.num + ' · ' + cp.slot + ' — ' + (r ? r.label + ' (' + r.en + ')' : cp.role) + ' · ' + d.label + ' (' + d.en + ')' +
      (cp.instructions.length ? ' · Instruções: ' + piLabels(cp.instructions) : '');
  }
  function piLabels(keys) { return keys.map(function (k) { return piDefs()[k] ? piDefs()[k].label : k; }).join(', '); }

  function renderPitch(svg, result, opts) {
    var players = svg.querySelector('.players');
    var ghosts = svg.querySelector('.ghosts');
    var ballLayer = svg.querySelector('.ball-layer');
    var zones = svg.querySelector('.zones');
    var shapes = svg.querySelector('.shapes');

    // linhas de estrutura: liga os jogadores de cada linha do time (e do adversário, mais discreto)
    shapes.textContent = '';
    if (opts.shapes) {
      [[result.players, false], [result.opponent ? result.opponent.players : null, true]].forEach(function (t) {
        if (!t[0]) return;
        E.teamShape(t[0], { attackingDown: t[1] }).lines.forEach(function (line) {
          // liga só vizinhos (por x) que estão quase na mesma altura: evita zigue-zague em linhas escalonadas
          for (var i = 1; i < line.length; i++) {
            var a = line[i - 1], b = line[i];
            if (Math.abs(a.y - b.y) > 5) continue;
            var ca = toSvg(a.x, a.y), cb = toSvg(b.x, b.y);
            svgEl('line', { x1: ca[0], y1: ca[1], x2: cb[0], y2: cb[1], class: t[1] ? 'shape-line-opp' : 'shape-line-us' }, shapes);
          }
        });
      });
    }

    // zona de deambulação (Roam): área em que o jogador circula, não um ponto fixo
    zones.textContent = '';
    result.players.forEach(function (cp) {
      if (!cp.zone) return;
      var c = toSvg(cp.x, cp.y);
      var z = svgEl('ellipse', { cx: c[0], cy: c[1], rx: cp.zone.rx * SX, ry: cp.zone.ry * SY, class: 'zone' }, zones);
      z.style.stroke = 'var(--b-' + cp.band + ')';
      z.style.fill = 'var(--b-' + cp.band + ')';
    });

    ghosts.textContent = '';
    if (opts.ghost) {
      result.players.forEach(function (cp) {
        var a = toSvg(cp.baseX, cp.baseY), b = toSvg(cp.x, cp.y);
        svgEl('circle', { cx: a[0], cy: a[1], r: R, class: 'ghost' }, ghosts);
        var vx = b[0] - a[0], vy = b[1] - a[1], d = Math.sqrt(vx * vx + vy * vy);
        if (d > 2 * R + 0.8) {
          var ux = vx / d, uy = vy / d;
          svgEl('line', {
            x1: a[0] + ux * R, y1: a[1] + uy * R, x2: b[0] - ux * (R + 0.4), y2: b[1] - uy * (R + 0.4),
            class: 'arrow', 'marker-end': 'url(#ah-' + svg.id + ')'
          }, ghosts);
        }
      });
    }

    ballLayer.textContent = '';
    if (result.ball) {
      var bp = toSvg(result.ball.x, result.ball.y);
      svgEl('circle', { cx: bp[0], cy: bp[1], r: 0.95, class: 'ball' }, ballLayer);
    }

    result.players.forEach(function (cp) {
      var g = players.querySelector('g.pl[data-i="' + cp.index + '"]');
      if (!g) {
        g = svgEl('g', { class: 'pl', 'data-i': cp.index }, players);
        svgEl('circle', { r: R, class: 'pc' }, g);
        svgEl('text', { class: 'ab' }, g);
        svgEl('circle', { cx: 2.35, cy: -2.35, r: 1.05, class: 'nb' }, g);
        svgEl('text', { x: 2.35, y: -2.3, class: 'no' }, g);
        svgEl('circle', { cx: -2.35, cy: 2.35, r: 0.75, class: 'pi-dot' }, g);
        svgEl('title', {}, g);
        g.addEventListener('pointerenter', onPlayerHover);
        g.addEventListener('pointerleave', onPlayerLeave);
        g.addEventListener('click', onPlayerHover);
        g.addEventListener('pointerdown', onDragStart);
      }
      var r = data.roles[cp.role];
      var label = (r ? r.abbr : '?') + '-' + cp.duty;
      var p = toSvg(cp.x, cp.y);
      g.style.transform = 'translate(' + p[0] + 'px,' + p[1] + 'px)';
      g.setAttribute('data-band', cp.band);
      g.querySelector('.pc').style.fill = 'var(--b-' + cp.band + ')';
      var t = g.querySelector('.ab');
      t.textContent = label;
      t.setAttribute('font-size', abbrFont(label.length));
      g.querySelector('.no').textContent = cp.num;
      g.querySelector('.pi-dot').style.display = cp.instructions.length || cp.traits.length ? '' : 'none';
      g.querySelector('title').textContent = playerTitle(cp) + ' · x ' + fmt(cp.x) + ', y ' + fmt(cp.y);
    });
    players.querySelectorAll('g.pl').forEach(function (g) {
      if (Number(g.dataset.i) >= result.players.length) g.remove();
    });
    renderOpponent(svg, result.opponent);
  }

  function renderOpponent(svg, opp) {
    var layer = svg.querySelector('.opps');
    var list = opp ? opp.players : [];
    list.forEach(function (cp) {
      var g = layer.querySelector('g.op[data-i="' + cp.index + '"]');
      if (!g) {
        g = svgEl('g', { class: 'op', 'data-i': cp.index }, layer);
        svgEl('rect', { x: -2.6, y: -2.6, width: 5.2, height: 5.2, rx: 1.1, class: 'oc' }, g);
        svgEl('text', { class: 'oab' }, g);
        svgEl('title', {}, g);
        g.addEventListener('pointerenter', onOppHover);
        g.addEventListener('click', onOppHover);
      }
      var r = data.roles[cp.role];
      var label = (r ? r.abbr : '?') + '-' + cp.duty;
      var p = toSvg(cp.x, cp.y);
      g.style.transform = 'translate(' + p[0] + 'px,' + p[1] + 'px)';
      var t = g.querySelector('.oab');
      t.textContent = label;
      t.setAttribute('font-size', abbrFont(label.length) * 0.9);
      g.querySelector('title').textContent = 'Adversário · ' + cp.slot + ' — ' + (r ? r.label + ' (' + r.en + ')' : cp.role);
    });
    layer.querySelectorAll('g.op').forEach(function (g) {
      if (Number(g.dataset.i) >= list.length) g.remove();
    });
  }

  function onOppHover(e) {
    var g = e.currentTarget;
    showOppInfo(g.ownerSVGElement, Number(g.dataset.i));
  }

  function showOppInfo(svg, index) {
    var ph = svg.dataset.phase;
    var opp = lastComputed && lastComputed[ph] && lastComputed[ph].opponent;
    var cp = opp && opp.players[index];
    var info = $('info-' + ph);
    if (!cp || !info) return;
    ui.info[ph] = { team: 'opp', index: index };
    var r = data.roles[cp.role], d = E.DUTIES[cp.duty] || { label: cp.duty };
    info.textContent = '';
    info.appendChild(el('b', null, 'Adversário · ' + cp.slot));
    info.appendChild(document.createTextNode(' ' + (r ? r.label + ' (' + r.en + ')' : cp.role) + ' — ' + d.label +
      ' · ' + opp.label + (opp.style ? ' · estilo ' + opp.style.label : '') + (cp.offside ? ' · contido pela linha de impedimento' : '')));
  }

  function computedFor(svg, index) {
    var ph = svg.dataset.phase;
    return lastComputed && lastComputed[ph] && lastComputed[ph].players[index];
  }

  function onPlayerHover(e) {
    var g = e.currentTarget, svg = g.ownerSVGElement;
    svg.querySelectorAll('g.pl.hl').forEach(function (x) { x.classList.remove('hl'); });
    g.classList.add('hl');
    showPlayerInfo(svg, Number(g.dataset.i));
  }

  /** Texto de detalhes do jogador; guardado em ui.info para ser atualizado quando a tática muda. */
  function showPlayerInfo(svg, index) {
    var cp = computedFor(svg, index);
    var info = $('info-' + svg.dataset.phase);
    if (!cp || !info) return;
    ui.info[svg.dataset.phase] = { team: 'us', index: index };
    info.textContent = '';
    info.appendChild(el('b', null, cp.num + ' · ' + cp.slot));
    var r = data.roles[cp.role], d = E.DUTIES[cp.duty] || { label: cp.duty, en: cp.duty };
    var txt = ' ' + (r ? r.label + ' (' + r.en + ')' : cp.role) + ' — ' + d.label;
    if (cp.effDuty && cp.effDuty !== cp.duty) txt += ' → ' + (E.DUTIES[cp.effDuty] || { label: cp.effDuty }).label + ' (pela mentalidade)';
    txt += ' · x ' + fmt(cp.x) + ', y ' + fmt(cp.y);
    if (cp.zone) txt += cp.zone.rx > cp.zone.ry ? ' · circula pelos corredores (±' + fmt(cp.zone.rx) + ' na largura)' : ' · deambula num raio de ~' + fmt(cp.zone.rx);
    if (cp.locked && cp.locked.length) txt += ' · embutidas na função: ' + piLabels(cp.locked);
    if (cp.offside) txt += ' · contido pela linha de impedimento do adversário';
    if (cp.rule) {
      var keys = Object.keys(cp.rule).filter(function (k) { return k !== 'if' && k !== 'onlyBands' && k !== 'locked'; });
      txt += ' · regra: ' + keys.map(function (k) { return k + ' ' + (Array.isArray(cp.rule[k]) ? cp.rule[k].join('+') : cp.rule[k]); }).join(', ');
    }
    if (cp.instructions.length) txt += ' · instruções: ' + piLabels(cp.instructions);
    if (cp.traits.length) txt += ' · características: ' + cp.traits.map(function (k) { return traitDefs()[k].label; }).join(', ');
    info.appendChild(document.createTextNode(txt));
    if (r && r.desc) info.appendChild(el('span', { class: 'desc' }, r.desc));
  }
  function onPlayerLeave(e) { e.currentTarget.classList.remove('hl'); }

  // ---------- modo editar regra (arrastar) ----------

  function clientToSvg(svg, cx, cy) {
    var pt = svg.createSVGPoint();
    pt.x = cx; pt.y = cy;
    var p = pt.matrixTransform(svg.getScreenCTM().inverse());
    return [p.x, p.y];
  }

  function onDragStart(e) {
    var g = e.currentTarget, svg = g.ownerSVGElement;
    if (!ui.edit || svg.id === 'animSvg') return;
    e.preventDefault();
    drag = { g: g, svg: svg, phase: svg.dataset.phase, index: Number(g.dataset.i), pointerId: e.pointerId, moved: false };
    g.classList.add('dragging');
  }
  function onDragMove(e) {
    if (!drag || e.pointerId !== drag.pointerId) return;
    var p = clientToSvg(drag.svg, e.clientX, e.clientY);
    p[0] = Math.max(P, Math.min(P + 68, p[0]));
    p[1] = Math.max(P, Math.min(P + 105, p[1]));
    drag.pos = p; drag.moved = true;
    drag.g.style.transform = 'translate(' + p[0] + 'px,' + p[1] + 'px)';
  }
  function onDragCancel() {
    if (!drag) return;
    drag.g.classList.remove('dragging');
    drag = null;
    renderFields();
  }
  function onDragEnd(e) {
    if (!drag || e.pointerId !== drag.pointerId) return;
    var d = drag; drag = null;
    d.g.classList.remove('dragging');
    if (!d.moved) return;
    var cp = computedFor(d.svg, d.index);
    var n = fromSvg(d.pos[0], d.pos[1]);
    var fx = E.clamp(n[0], 2, 98), fy = E.clamp(n[1], 2, 98);
    var derived = !!data.formations.phases[d.phase].derive;
    var ov = derived ? E.deltaFromPosition(cp, fx, fy) : E.overrideFromPosition(cp, fx, fy);
    data.roles = E.applyOverride(data.roles, cp.role, cp.duty, d.phase, ov);
    lsSet(LS_ROLES, data.roles);
    renderAll();

    var after = computedFor(d.svg, d.index);
    var r = data.roles[cp.role];
    var msg = 'Regra salva: ' + r.abbr + '-' + cp.duty + ' · ' + data.formations.phases[d.phase].label + ' → ' +
      (derived ? (ov.dx != null ? 'dx ' + fmt(ov.dx) + ', ' : '') + 'dy ' + fmt(ov.dy) + ' (deslocamento extra desta fase)'
               : (ov.x != null ? 'x ' + fmt(ov.x) + ', ' : '') + 'y ' + fmt(ov.y)) + ' (vale para todo ' + r.abbr + '-' + cp.duty + ').';
    if (cp.side === 'C') msg += ' Slot central: só o y é gravado.';
    if (after && Math.hypot(after.x - fx, after.y - fy) > 1.5) msg += ' Atenção: um efeito ou a colisão alterou a posição final.';
    toast(msg, 6000);
  }

  // ---------- painel ----------

  function renderSlotGrid() {
    var grid = $('slotGrid'), f = data.formations;
    grid.textContent = '';
    var bySlot = {}, nums = E.numberPlayers(state.players, f);
    state.players.forEach(function (p, i) { bySlot[p.slot] = { p: p, num: nums[i] }; });
    var lookup = {};
    Object.keys(f.slots).forEach(function (s) { lookup[f.slots[s].band + ':' + f.slots[s].lane] = s; });

    ['ST', 'AM', 'M', 'DM', 'D', 'GK'].forEach(function (band) {
      E.LANE_ORDER.forEach(function (lane) {
        var slot = lookup[band + ':' + lane];
        if (!slot) { grid.appendChild(el('div', { class: 'slot empty-cell', 'aria-hidden': 'true' })); return; }
        var occ = bySlot[slot];
        var b = el('button', { class: 'slot', 'data-slot': slot, 'data-band': band, type: 'button' });
        if (occ) {
          var r = data.roles[occ.p.role];
          b.classList.add('filled');
          b.style.background = 'var(--b-' + band + ')';
          b.style.borderColor = 'var(--b-' + band + ')';
          b.appendChild(document.createTextNode((r ? r.abbr : '?') + '-' + occ.p.duty));
          b.appendChild(el('small', null, slot));
          b.title = occ.num + ' · ' + slot + ' — ' + (r ? r.label : occ.p.role);
          if (ui.selectedSlot === slot) b.classList.add('selected');
        } else {
          b.textContent = slot;
          if (ui.selectedSlot) b.classList.add('target');
          b.title = ui.selectedSlot ? 'Mover ' + ui.selectedSlot + ' para ' + slot : slot;
        }
        b.addEventListener('click', function () { onSlotClick(slot); });
        grid.appendChild(b);
      });
    });
  }

  function onSlotClick(slot) {
    var idx = state.players.findIndex(function (p) { return p.slot === slot; });
    var selIdx = state.players.findIndex(function (p) { return p.slot === ui.selectedSlot; });
    if (idx >= 0) {
      if (ui.selectedSlot === slot) ui.selectedSlot = null;
      else if (selIdx >= 0 && (slot === 'GK') === (ui.selectedSlot === 'GK')) {
        // troca dois jogadores de linha de lugar
        var a = state.players[selIdx], b = state.players[idx];
        var t = a.slot; a.slot = b.slot; b.slot = t;
        fixPlayer(a); fixPlayer(b);
        ui.selectedSlot = null;
      } else ui.selectedSlot = slot;
    } else if (selIdx >= 0) {
      if (ui.selectedSlot === 'GK' || slot === 'GK') { toast('O goleiro só pode ocupar o slot GK.'); return; }
      var cnt = state.players.filter(function (p) {
        var s = data.formations.slots[p.slot], t2 = data.formations.slots[slot];
        return p.slot !== ui.selectedSlot && s.band === t2.band && ['CL', 'C', 'CR'].indexOf(s.lane) >= 0;
      }).length;
      if (['CL', 'C', 'CR'].indexOf(data.formations.slots[slot].lane) >= 0 && cnt >= 3) { toast('No máximo 3 jogadores centrais por faixa.'); return; }
      state.players[selIdx].slot = slot;
      fixPlayer(state.players[selIdx]);
      ui.selectedSlot = null;
    } else return;
    renderAll();
  }

  function renderPlayerList() {
    var list = $('playerList'), f = data.formations;
    list.textContent = '';
    var nums = E.numberPlayers(state.players, f);
    var order = state.players.map(function (p, i) { return i; })
      .sort(function (a, b) { return E.slotOrder(f, state.players[a].slot) - E.slotOrder(f, state.players[b].slot); });

    order.forEach(function (i) {
      var p = state.players[i], band = f.slots[p.slot].band;
      var row = el('div', { class: 'prow' });
      var num = el('span', { class: 'num', 'data-band': band }, String(nums[i]));
      num.style.background = 'var(--b-' + band + ')';
      row.appendChild(num);
      row.appendChild(el('span', { class: 'slotname' }, p.slot));

      var rs = el('select', { 'aria-label': 'Função ' + p.slot });
      E.rolesForSlot(data.roles, p.slot)
        .sort(function (a, b) { return data.roles[a].label.localeCompare(data.roles[b].label, 'pt-BR'); })
        .forEach(function (k) {
          var r = data.roles[k];
          rs.appendChild(el('option', { value: k }, r.label + ' (' + r.en + ')' + (r.uncertain ? ' ⚠' : '')));
        });
      rs.value = p.role;
      rs.addEventListener('change', function () {
        p.role = rs.value;
        if (!data.roles[p.role].duties[p.duty]) p.duty = Object.keys(data.roles[p.role].duties)[0];
        prunePIs(p);
        renderAll();
      });
      row.appendChild(rs);

      var ds = el('select', { 'aria-label': 'Tarefa ' + p.slot });
      Object.keys((data.roles[p.role] || { duties: {} }).duties).forEach(function (d) {
        ds.appendChild(el('option', { value: d }, (E.DUTIES[d] || { label: d }).label));
      });
      ds.value = p.duty;
      ds.addEventListener('change', function () { p.duty = ds.value; prunePIs(p); renderAll(); });
      row.appendChild(ds);

      var n = (p.instructions || []).length + (p.traits || []).length, open = ui.piOpen === p.slot;
      var pb = el('button', {
        class: 'pi-btn' + (n ? ' has' : '') + (open ? ' open' : ''), type: 'button',
        'aria-expanded': String(open), 'aria-label': 'Instruções individuais ' + p.slot,
        title: n ? 'Instruções e características: ' + piLabels((p.instructions || []).concat()) + ((p.traits || []).length ? ' · ' + p.traits.map(function (k) { return (traitDefs()[k] || { label: k }).label; }).join(', ') : '') : 'Instruções individuais e características do jogador'
      }, n ? 'PI ' + n : 'PI');
      pb.addEventListener('click', function () { ui.piOpen = open ? null : p.slot; renderPlayerList(); });
      row.appendChild(pb);
      list.appendChild(row);
      if (open) list.appendChild(renderPIBox(p));
    });
  }

  function renderPIBox(p) {
    var defs = piDefs(), groups = (data.playerInstructions && data.playerInstructions.groups) || {};
    var info = E.slotInfo(data.formations, p.slot);
    var box = el('div', { class: 'pi-box' });
    var current = p.instructions || [];
    Object.keys(groups).forEach(function (gk) {
      var keys = Object.keys(defs).filter(function (k) { return defs[k].group === gk; });
      if (!keys.length) return;
      box.appendChild(el('div', { class: 'pi-group' }, groups[gk]));
      keys.forEach(function (k) {
        var def = defs[k], av = E.piAvailability(def, p, info, data.roles, k);
        var lab = el('label', { class: 'check' + (av.ok ? '' : ' disabled') + (av.locked ? ' locked' : ''), title: def.note || def.en });
        var cb = el('input', { type: 'checkbox' });
        cb.checked = current.indexOf(k) >= 0 || !!av.locked;
        cb.disabled = !av.ok;
        cb.addEventListener('change', function () { togglePI(p, k, cb.checked); });
        lab.appendChild(cb);
        var txt = el('span', { class: 'pi-text' }, def.label + ' (' + def.en + ')');
        if (!av.ok) txt.appendChild(el('small', null, av.reason));
        lab.appendChild(txt);
        box.appendChild(lab);
      });
    });
    renderTraitsSection(box, p, info);
    if (current.length || (p.traits || []).length) {
      var clr = el('button', { class: 'btn small', type: 'button' }, 'Limpar instruções e características');
      clr.addEventListener('click', function () { delete p.instructions; delete p.traits; renderAll(); });
      box.appendChild(clr);
    }
    return box;
  }

  /** Seção "Características do jogador" (Player Traits do manual do FM23) dentro do painel PI. */
  function renderTraitsSection(box, p, info) {
    var defs = traitDefs(), keys = Object.keys(defs);
    if (!keys.length) return;
    box.appendChild(el('div', { class: 'pi-group' }, 'Características do jogador (traits)'));
    var active = E.resolvePlayerInstructions(p, info, piDefs(), data.roles).applied.concat(E.lockedFor(data.roles, p));
    var res = E.resolveTraits(p, info, defs, active);
    var why = {};
    res.ignored.forEach(function (i) { why[i.key] = i.reason; });
    var current = p.traits || [];
    keys.forEach(function (k) {
      var def = defs[k], av = E.piAvailability(def, p, info);
      var on = current.indexOf(k) >= 0;
      var lab = el('label', { class: 'check' + (av.ok ? '' : ' disabled'), title: def.official || def.en });
      var cb = el('input', { type: 'checkbox' });
      cb.checked = on;
      cb.disabled = !av.ok;
      cb.addEventListener('change', function () { toggleTrait(p, k, cb.checked); });
      lab.appendChild(cb);
      var txt = el('span', { class: 'pi-text' }, def.label + ' (' + def.en + ')');
      if (!av.ok) txt.appendChild(el('small', null, av.reason));
      else if (on && why[k]) txt.appendChild(el('small', { class: 'warn-note' }, 'sem efeito: ' + why[k]));
      lab.appendChild(txt);
      box.appendChild(lab);
    });
  }

  function toggleTrait(p, key, on) {
    var defs = traitDefs(), list = (p.traits || []).filter(function (k) { return k !== key; });
    if (on) {
      list = list.filter(function (k) {
        return (defs[key].excludes || []).indexOf(k) < 0 && ((defs[k] || {}).excludes || []).indexOf(key) < 0;
      });
      list.push(key);
    }
    if (list.length) p.traits = list; else delete p.traits;
    renderAll();
  }

  /** Liga/desliga uma PI; ao ligar, desliga as mutuamente exclusivas (como no jogo). */
  function togglePI(p, key, on) {
    var defs = piDefs(), list = (p.instructions || []).filter(function (k) { return k !== key; });
    if (on) {
      list = list.filter(function (k) {
        return (defs[key].excludes || []).indexOf(k) < 0 && ((defs[k] || {}).excludes || []).indexOf(key) < 0;
      });
      list.push(key);
    }
    if (list.length) p.instructions = list; else delete p.instructions;
    renderAll();
  }

  function renderValidation(v, extra) {
    var box = $('validation');
    box.textContent = '';
    v.errors.forEach(function (m) { box.appendChild(el('div', { class: 'msg err' }, m)); });
    v.warnings.concat(extra || []).forEach(function (m) { box.appendChild(el('div', { class: 'msg warn' }, m)); });
  }

  // ---------- render geral ----------

  function renderFields() {
    if (!lastComputed) return;
    E.PHASES.forEach(function (ph) {
      var line = $('oppline-' + ph), o = lastComputed[ph].opponent;
      if (!line) return;
      line.textContent = o ? 'Adversário ' + presetById(state.opp.presetId).label + ' · ' + (o.style ? o.style.label : '') + ' · ' + o.label + ' (ataca ↓)' : '';
      line.hidden = !o;
    });
    E.PHASES.forEach(function (ph) {
      var svg = $('pitch-' + ph);
      svg.classList.toggle('editing', ui.edit);
      renderPitch(svg, lastComputed[ph], { ghost: ui.ghost, shapes: ui.shapes });
      var sl = $('shape-' + ph);
      if (sl) {
        var sh = E.teamShape(lastComputed[ph].players), m = sh.metrics;
        var txt = 'Estrutura ' + sh.shape + ' · comprimento ' + m.length + ' m · largura ' + m.width + ' m · última linha a ' + m.lastLine + ' m do gol';
        var o = lastComputed[ph].opponent;
        if (o) {
          var so = E.teamShape(o.players, { attackingDown: true });
          txt += ' — adversário ' + so.shape + ', ' + so.metrics.length + ' m';
        }
        sl.textContent = txt;
        sl.hidden = !ui.shapes;
      }
    });
    if (anim.on) renderAnimStep();
    // reescreve os detalhes do jogador selecionado com os valores novos
    E.PHASES.forEach(function (ph) {
      var sel = ui.info[ph], svg = $('pitch-' + ph);
      if (!sel || !svg) return;
      if (sel.team === 'opp') {
        if (lastComputed[ph].opponent) showOppInfo(svg, sel.index); else { ui.info[ph] = null; $('info-' + ph).textContent = 'Passe o mouse ou toque num jogador para ver detalhes.'; }
      } else showPlayerInfo(svg, sel.index);
    });
  }

  function renderAll() {
    var v = E.validate(state.players, data);
    var extra = [];
    if (v.ok) {
      lastComputed = E.computeMatch(state.players, data, state.ti, oppConfig());
      E.PHASES.forEach(function (ph) { extra = extra.concat(lastComputed[ph].warnings); });
    }
    renderSlotGrid();
    renderPlayerList();
    renderValidation(v, extra);
    renderFields();
    $('rolesStatus').textContent = lsGet(LS_ROLES)
      ? 'Usando regras personalizadas (salvas neste navegador). Exporte o roles.json para guardar.'
      : 'Usando as regras padrão de data/roles.json.';
    saveState();
  }

  // ---------- animação ----------

  function renderAnimStep() {
    var phs = groupPhases(), ph = phs[anim.step % phs.length];
    var svg = $('animSvg');
    svg.dataset.phase = ph;
    renderPitch(svg, lastComputed[ph], { ghost: false, shapes: ui.shapes });
    document.querySelectorAll('#animSteps span').forEach(function (s) {
      s.classList.toggle('on', s.dataset.phase === ph);
      s.hidden = phs.indexOf(s.dataset.phase) < 0;
    });
  }

  function toggleAnim() {
    anim.on = !anim.on;
    $('animView').hidden = !anim.on;
    $('fields').hidden = anim.on;
    $('tabs').style.visibility = anim.on ? 'hidden' : '';
    $('animate').textContent = anim.on ? '■ Parar' : '▶ Animar';
    clearInterval(anim.timer);
    if (anim.on) {
      anim.step = 0;
      renderAnimStep();
      anim.timer = setInterval(function () { anim.step = (anim.step + 1) % groupPhases().length; renderAnimStep(); }, 2000);
    }
  }

  // ---------- início ----------

  function showFatal(err) {
    var box = el('div', { class: 'fatal' });
    box.appendChild(el('strong', null, 'Não foi possível carregar os dados. '));
    box.appendChild(document.createTextNode(
      'Se você abriu o index.html direto do disco (file://), o navegador bloqueia a leitura de data/*.json. ' +
      'Rode um servidor local na pasta do projeto (python3 -m http.server 8000) ou use o arquivo único dist/fm23-viewer.html. Detalhe: ' +
      (err && err.message ? err.message : err)));
    document.querySelector('.main').prepend(box);
  }

  /**
   * Se a página veio de um cache antigo (o GitHub Pages não deixa configurar o tempo de cache),
   * compara com version.json publicado e recarrega uma vez com ?v=<versão nova>.
   */
  function checkFreshVersion() {
    var vm = document.querySelector('meta[name="fm23pv-version"]');
    if (!vm || location.protocol === 'file:' || !window.fetch) return;
    fetch('version.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        if (!j || !j.version || j.version === vm.content) return;
        var key = 'fm23pv.reloaded.' + j.version;
        try { if (sessionStorage.getItem(key)) return; sessionStorage.setItem(key, '1'); } catch (e) { /* sem storage */ }
        location.replace(location.pathname + '?v=' + j.version + location.hash);
      })
      .catch(function () { /* offline: segue com a versão atual */ });
  }

  function init() {
    if (!E) { showFatal('engine.js não carregado'); return; }
    checkFreshVersion();
    loadData().then(function (d) {
      data = d;
      baseRoles = clone(d.roles);
      var custom = lsGet(LS_ROLES);
      if (isRolesObj(custom)) data.roles = custom;

      var savedUi = lsGet(LS_UI) || {};
      ui.ghost = !!savedUi.ghost;
      ui.collapsed = !!savedUi.collapsed;
      if (E.PHASES.indexOf(savedUi.tab) >= 0) ui.tab = savedUi.tab;
      if (['sem', 'com', 'todas'].indexOf(savedUi.group) >= 0) ui.group = savedUi.group;
      if (savedUi.shapes === false) ui.shapes = false;

      var saved = lsGet(LS_STATE);
      if (saved && Array.isArray(saved.players) && E.validate(saved.players, data).ok) {
        state = { presetId: saved.presetId, players: saved.players, ti: Object.assign(defaultTI(), saved.ti || {}), opp: Object.assign(defaultOpp(), saved.opp || {}) };
      } else state = defaultState();

      buildStatic();
      syncTIForm();
      syncOppForm();
      syncTabs();
      renderAll();
    }).catch(showFatal);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
</body>
</html>
